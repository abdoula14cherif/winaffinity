<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winaffinity — Parrainage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Manrope:wght@400;600;700;800&display=swap');
  :root{ --navy:#0B1A3D; --red:#7A1F2B; --cream:#F3EFE6; --gold:#E8B84B; --text-dark:#16223F; --text-dim:#6B7385; --green:#2FBF8F; --line:#E4DFD3; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ overflow-x:hidden; max-width:100vw; }
  body{ background:var(--cream); color:var(--text-dark); font-family:'Manrope', sans-serif; min-height:100vh; padding-bottom:78px; }
  .header{ background: linear-gradient(115deg, var(--navy) 0%, var(--navy) 45%, var(--red) 100%); padding:20px; color:#fff; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:10px; background: rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; }
  .header h1{ font-family:'Fraunces', serif; font-size:1.15rem; }
  .wrap{ max-width:480px; margin:0 auto; padding:24px 20px; }
  .card{ background:#fff; border-radius:18px; padding:22px; border:1px solid var(--line); box-shadow:0 8px 20px -14px rgba(22,34,63,0.25); margin-bottom:16px; }
  .titre{ font-family:'Fraunces', serif; font-weight:700; font-size:1.1rem; margin-bottom:4px; }
  .cat{ color:var(--text-dim); font-size:0.85rem; margin-bottom:16px; }
  .commission-box{ background:var(--cream); border-radius:12px; padding:14px 16px; margin-bottom:18px; text-align:center; }
  .commission-box .amount{ font-family:'Fraunces', serif; font-weight:700; font-size:1.4rem; color:var(--green); }
  .commission-box .label{ font-size:0.78rem; color:var(--text-dim); margin-top:2px; }
  .link-box{ display:flex; align-items:center; gap:10px; background:var(--cream); border:1px dashed var(--text-dim); border-radius:12px; padding:12px 14px; }
  .link-box span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.8rem; font-weight:600; }
  .copy-pill{ background:var(--navy); color:#fff; font-weight:700; font-size:0.75rem; padding:9px 16px; border-radius:999px; flex-shrink:0; cursor:pointer; }
  .share-row{ display:flex; gap:10px; margin-top:14px; }
  .share-btn{ flex:1; text-align:center; padding:12px; border-radius:12px; font-weight:700; font-size:0.85rem; background:#fff; border:1px solid var(--line); }
</style>
</head>
<body>

<div class="header">
  <a href="/catalogue" class="back-btn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </a>
  <h1>Affiliation</h1>
</div>

<div class="wrap">
  <div class="card" id="productCard" style="display:none;">
    <div class="titre" id="titre"></div>
    <div class="cat" id="cat"></div>
    <div class="commission-box">
      <div class="amount" id="commissionAmount">0 F</div>
      <div class="label">Ta commission par vente (50%)</div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:700; font-size:0.9rem; margin-bottom:10px;">Ton lien d'affiliation</div>
    <div class="link-box">
      <span id="refLink">Chargement...</span>
      <div class="copy-pill" onclick="copyLink()">Copier</div>
    </div>
    <div class="share-row">
      <a href="#" class="share-btn" id="shareWhatsapp">WhatsApp</a>
      <a href="#" class="share-btn" id="shareSMS">SMS</a>
    </div>
  </div>
</div>

<script>
  const API_BASE = "https://www.winaffinity.vip";
  const token = localStorage.getItem("winaffinity_token");
  if (!token) { window.location.href = "/"; }

  const params = new URLSearchParams(window.location.search);
  const contenuId = params.get("id");
  let generatedLink = "";

  async function init() {
    try {
      const meRes = await fetch(`${API_BASE}/auth/me`, { headers: { "Authorization": `Bearer ${token}` } });
      if (!meRes.ok) { window.location.href = "/"; return; }
      const me = await meRes.json();

      if (contenuId) {
        const cRes = await fetch(`${API_BASE}/contenus/${contenuId}`);
        if (cRes.ok) {
          const contenu = await cRes.json();
          document.getElementById("productCard").style.display = "block";
          document.getElementById("titre").textContent = contenu.titre;
          document.getElementById("cat").textContent = contenu.categorie;
          document.getElementById("commissionAmount").textContent = `${Math.round(contenu.prix * 0.5).toLocaleString('fr-FR')} F`;
          generatedLink = `https://www.winaffinity.vip/payer?id=${contenuId}&ref=${me.referral_code}`;
        }
      } else {
        generatedLink = `https://www.winaffinity.vip/?ref=${me.referral_code}`;
      }

      document.getElementById("refLink").textContent = generatedLink;
      document.getElementById("shareWhatsapp").href = `https://wa.me/?text=${encodeURIComponent("Découvre ce contenu sur Winaffinity : " + generatedLink)}`;
      document.getElementById("shareSMS").href = `sms:?body=${encodeURIComponent(generatedLink)}`;
    } catch (e) {
      document.getElementById("refLink").textContent = "Erreur de chargement";
    }
  }

  function copyLink() {
    navigator.clipboard.writeText(generatedLink).then(() => {
      const btn = document.querySelector(".copy-pill");
      const old = btn.textContent;
      btn.textContent = "Copié !";
      setTimeout(() => { btn.textContent = old; }, 1500);
    });
  }

  init();
</script>

</body>
</html>
