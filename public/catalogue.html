<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winaffinity — Catalogue</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --navy: #0B1A3D; --red: #7A1F2B; --cream: #F3EFE6; --gold: #E8B84B;
    --text-dark: #16223F; --text-dim: #6B7385; --green: #2FBF8F; --line: #E4DFD3;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ overflow-x: hidden; max-width: 100vw; }
  body{ background: var(--cream); color: var(--text-dark); font-family: 'Manrope', sans-serif; padding-bottom: 78px; }
  h1,h2{ font-family: 'Fraunces', serif; font-weight: 600; }
  a,button{ color: inherit; text-decoration: none; font-family: inherit; }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 0 20px; }

  .header{ background: linear-gradient(115deg, var(--navy) 0%, var(--navy) 45%, var(--red) 100%); padding: 20px 20px 0; color:#fff; }
  .header-top{ display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:10px; background: rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .header h1{ font-size:1.2rem; }
  .header p{ color: rgba(255,255,255,0.6); font-size:0.82rem; margin-top:4px; }

  .tabs{ display:flex; gap:4px; margin-top:20px; background: rgba(255,255,255,0.1); border-radius:12px; padding:4px; }
  .tab{ flex:1; text-align:center; padding:10px; border-radius:9px; font-size:0.85rem; font-weight:700; color: rgba(255,255,255,0.6); cursor:pointer; }
  .tab.active{ background:#fff; color: var(--navy); }
  .tabs-spacer{ height:16px; }

  .filters{ display:flex; gap:8px; overflow-x:auto; padding: 16px 20px 4px; scrollbar-width:none; }
  .filters::-webkit-scrollbar{ display:none; }
  .filter-pill{ flex-shrink:0; padding:8px 16px; border-radius:999px; font-size:0.8rem; font-weight:700; background:#fff; border:1px solid var(--line); color: var(--text-dim); cursor:pointer; }
  .filter-pill.active{ background: var(--navy); color:#fff; border-color: var(--navy); }

  .grid{ padding: 16px 20px 0; display:flex; flex-direction:column; gap:12px; }
  .card{ background:#fff; border-radius:16px; padding:14px; border:1px solid var(--line); box-shadow: 0 8px 20px -14px rgba(22,34,63,0.25); display:flex; gap:14px; align-items:center; cursor:pointer; }
  .thumb{ width:56px; height:56px; border-radius:12px; flex-shrink:0; object-fit:cover; background: var(--cream); }
  .type-badge{ width:56px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:0.66rem; font-weight:800; text-transform:uppercase; }
  .type-formation{ background:#E4EBFB; color:#3B5BDB; }
  .type-ebook{ background:#FBF0D8; color:#B8860B; }
  .card .info{ flex:1; min-width:0; }
  .card .titre{ font-weight:700; font-size:0.94rem; }
  .card .cat{ font-size:0.72rem; color: var(--text-dim); margin-top:2px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
  .card .snippet{ font-size:0.78rem; color: var(--text-dim); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prix-block{ text-align:right; flex-shrink:0; }
  .card .prix{ font-family:'Fraunces', serif; font-weight:700; color: var(--navy); font-size:0.92rem; white-space:nowrap; }
  .commission{ font-size:0.66rem; color: var(--green); font-weight:700; margin-top:2px; white-space:nowrap; }

  .empty{ text-align:center; color: var(--text-dim); padding: 40px 20px; }

  /* ABONNEMENTS */
  .plan-card{ background:#fff; border-radius:18px; padding:22px; border:1px solid var(--line); box-shadow: 0 8px 20px -14px rgba(22,34,63,0.25); margin-bottom:14px; }
  .plan-card.featured{ border-color: var(--gold); position:relative; }
  .plan-card.featured::before{ content:"Recommandé"; position:absolute; top:-11px; left:20px; background:var(--gold); color:#14100A; font-size:0.68rem; font-weight:800; padding:4px 12px; border-radius:999px; }
  .plan-card h3{ font-size:1rem; color: var(--text-dim); font-weight:700; font-family:'Manrope', sans-serif; }
  .plan-card .price{ font-family:'Fraunces', serif; font-size:2rem; margin:10px 0 4px; }
  .plan-card .price span{ font-size:0.9rem; color:var(--text-dim); font-family:'Manrope', sans-serif; }
  .plan-card ul{ list-style:none; margin:16px 0; display:flex; flex-direction:column; gap:9px; }
  .plan-card li{ font-size:0.86rem; color:var(--text-dim); display:flex; gap:8px; }
  .plan-card li::before{ content:"✓"; color:var(--green); font-weight:700; }
  .plan-btn{ width:100%; text-align:center; padding:13px; border-radius:12px; font-weight:700; font-size:0.9rem; background:var(--navy); color:#fff; }
  .plan-card.featured .plan-btn{ background:var(--gold); color:#14100A; }

  .bottom-nav{ position: fixed; left:0; right:0; bottom:0; background:#fff; border-top: 1px solid var(--line); display:flex; justify-content: space-around; padding: 10px 0 14px; z-index: 50; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:0.68rem; color: var(--text-dim); font-weight:700; }
  .nav-item.active{ color: var(--red); }
  .nav-item svg{ width:20px; height:20px; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(11,26,61,0.6); z-index:100; align-items:flex-end; justify-content:center; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:0 0 24px; max-height:88vh; overflow-y:auto; }
  .modal-img{ width:100%; height:160px; object-fit:cover; border-radius:20px 20px 0 0; display:none; }
  .modal-body{ padding:20px 20px 0; }
  .modal h2{ font-size:1.15rem; margin-bottom:4px; }
  .modal .sub{ color:var(--text-dim); font-size:0.82rem; margin-bottom:14px; }
  .modal-desc{ font-size:0.85rem; color:var(--text-dim); line-height:1.5; margin-bottom:18px; }
  .modal-price-row{ display:flex; justify-content:space-between; align-items:center; background:var(--cream); border-radius:12px; padding:14px 16px; margin-bottom:20px; }
  .modal-price-row .p{ font-family:'Fraunces', serif; font-weight:700; font-size:1.2rem; }
  .modal-price-row .c{ color:var(--green); font-size:0.78rem; font-weight:700; }
  .modal-actions{ display:flex; flex-direction:column; gap:10px; }
  .modal-btn{ width:100%; padding:14px; border-radius:12px; font-weight:700; font-size:0.95rem; text-align:center; }
  .btn-buy{ background:var(--navy); color:#fff; }
  .btn-affiliate{ background:var(--gold); color:#14100A; }
  .btn-cancel{ color:var(--text-dim); font-size:0.85rem; text-align:center; padding:6px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <a href="/dashboard" class="back-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </a>
    <div>
      <h1>Catalogue</h1>
      <p id="countLabel">Chargement...</p>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="ebook" onclick="selectTab('ebook', this)">Livres</div>
    <div class="tab" data-tab="formation" onclick="selectTab('formation', this)">Vidéos</div>
    <div class="tab" data-tab="abonnement" onclick="selectTab('abonnement', this)">Abonnements</div>
  </div>
  <div class="tabs-spacer"></div>
</div>

<div class="filters" id="filters"></div>

<div class="grid" id="grid"></div>
<div class="wrap" id="plansWrap" style="display:none; padding-top:16px;"></div>
<div class="empty" id="emptyMsg" style="display:none;">Aucun contenu dans cette catégorie.</div>

<div class="bottom-nav">
  <a href="/catalogue" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>eBooks</span>
  </a>
  <a href="/retrait" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
    <span>Retrait</span>
  </a>
  <a href="/promo" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg>
    <span>Promo</span>
  </a>
  <a href="/business" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M2 13h20"/></svg>
    <span>Business</span>
  </a>
</div>

<div class="modal-overlay" id="contentModal">
  <div class="modal">
    <img class="modal-img" id="modalImg" src="" alt="">
    <div class="modal-body">
      <h2 id="modalTitre">Titre</h2>
      <p class="sub" id="modalCat">Catégorie</p>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-price-row">
        <div>
          <div class="p" id="modalPrix">0 F</div>
          <div class="c" id="modalCommission">Tu gagnes 0 F (50%)</div>
        </div>
      </div>
      <div class="modal-actions">
        <div class="modal-btn btn-buy" onclick="goToPay()">Acheter maintenant</div>
        <div class="modal-btn btn-affiliate" onclick="goToAffiliate()">Affilier ce contenu</div>
        <div class="btn-cancel" onclick="closeModal()">Annuler</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "https://www.winaffinity.vip";
  let allContenus = [];
  let currentTab = "ebook";
  let selectedId = null;

  function renderContenus(list) {
    const grid = document.getElementById("grid");
    const emptyMsg = document.getElementById("emptyMsg");
    grid.style.display = "flex";
    document.getElementById("plansWrap").style.display = "none";
    grid.innerHTML = "";

    if (list.length === 0) { emptyMsg.style.display = "block"; return; }
    emptyMsg.style.display = "none";

    list.forEach(item => {
      const isFormation = item.type === "formation";
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openModal(item);

      const thumbHtml = item.image_url
        ? `<img class="thumb" src="${item.image_url}" alt="">`
        : `<div class="type-badge ${isFormation ? 'type-formation' : 'type-ebook'}">${isFormation ? 'VIDÉO' : 'LIVRE'}</div>`;

      const snippetHtml = item.description_longue
        ? `<div class="snippet">${item.description_longue}</div>`
        : "";

      card.innerHTML = `
        ${thumbHtml}
        <div class="info">
          <div class="titre">${item.titre}</div>
          <div class="cat">${item.categorie}</div>
          ${snippetHtml}
        </div>
        <div class="prix-block">
          <div class="prix">${item.prix.toLocaleString('fr-FR')} F</div>
          <div class="commission">Tu gagnes ${Math.round(item.prix * 0.5).toLocaleString('fr-FR')} F</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function renderPlans() {
    document.getElementById("grid").style.display = "none";
    document.getElementById("emptyMsg").style.display = "none";
    const plansWrap = document.getElementById("plansWrap");
    plansWrap.style.display = "block";
    plansWrap.innerHTML = `
      <div class="plan-card">
        <h3>Accès à l'unité</h3>
        <div class="price">Dès 300 <span>F CFA</span></div>
        <ul>
          <li>Achète un contenu au choix dans le catalogue</li>
          <li>Accès à vie au contenu acheté</li>
          <li>Lien de partage avec commission</li>
        </ul>
        <a href="/catalogue" class="plan-btn" style="background:#fff; color:var(--navy); border:1px solid var(--line);">Voir le catalogue</a>
      </div>
      <div class="plan-card featured">
        <h3>Abonnement illimité</h3>
        <div class="price">4 900 <span>F CFA / mois</span></div>
        <ul>
          <li>Accès à tout le catalogue : livres et vidéos</li>
          <li>Nouveaux contenus ajoutés chaque mois</li>
          <li>Commission de partage doublée</li>
        </ul>
        <a href="#" class="plan-btn">Bientôt disponible</a>
      </div>
    `;
    document.getElementById("countLabel").textContent = "Choisis ta formule";
    document.getElementById("filters").innerHTML = "";
  }

  function renderFilters(categories) {
    const filtersEl = document.getElementById("filters");
    filtersEl.innerHTML = `<div class="filter-pill active" data-cat="">Tout</div>`;
    filtersEl.querySelector('.filter-pill').onclick = () => selectFilter("", filtersEl.querySelector('.filter-pill'));
    categories.forEach(cat => {
      const pill = document.createElement("div");
      pill.className = "filter-pill";
      pill.textContent = cat;
      pill.dataset.cat = cat;
      pill.onclick = () => selectFilter(cat, pill);
      filtersEl.appendChild(pill);
    });
  }

  function selectFilter(cat, el) {
    document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
    const typed = allContenus.filter(c => c.type === currentTab);
    const filtered = cat ? typed.filter(c => c.categorie === cat) : typed;
    renderContenus(filtered);
  }

  function selectTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    el.classList.add("active");

    if (tab === "abonnement") {
      renderPlans();
      return;
    }

    const typed = allContenus.filter(c => c.type === tab);
    document.getElementById("countLabel").textContent = `${typed.length} contenus disponibles`;
    const categories = [...new Set(typed.map(c => c.categorie))];
    renderFilters(categories);
    renderContenus(typed);
  }

  function openModal(item) {
    selectedId = item.id;
    document.getElementById("modalTitre").textContent = item.titre;
    document.getElementById("modalCat").textContent = item.categorie;
    document.getElementById("modalDesc").textContent = item.description_longue || "";
    document.getElementById("modalPrix").textContent = `${item.prix.toLocaleString('fr-FR')} F`;
    document.getElementById("modalCommission").textContent = `Tu gagnes ${Math.round(item.prix * 0.5).toLocaleString('fr-FR')} F (50%)`;

    const modalImg = document.getElementById("modalImg");
    if (item.image_url) { modalImg.src = item.image_url; modalImg.style.display = "block"; }
    else { modalImg.style.display = "none"; }

    document.getElementById("contentModal").classList.add("open");
  }

  function closeModal() { document.getElementById("contentModal").classList.remove("open"); selectedId = null; }
  function goToPay() { if (selectedId) window.location.href = `/payer?id=${selectedId}`; }
  function goToAffiliate() { if (selectedId) window.location.href = `/parrainage?id=${selectedId}`; }

  async function loadCatalogue() {
    try {
      const res = await fetch(`${API_BASE}/contenus/`);
      allContenus = await res.json();
      selectTab("ebook", document.querySelector('.tab[data-tab="ebook"]'));
    } catch (e) {
      document.getElementById("countLabel").textContent = "Erreur de chargement";
    }
  }
  loadCatalogue();
</script>

</body>
</html>
