<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winaffinity — Confirmation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Manrope:wght@400;600;700;800&display=swap');
  :root{ --navy:#0B1A3D; --cream:#F3EFE6; --gold:#E8B84B; --text-dark:#16223F; --text-dim:#6B7385; --green:#2FBF8F; --red:#C0392B; --line:#E4DFD3; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--cream); color:var(--text-dark); font-family:'Manrope', sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  a{ color:inherit; text-decoration:none; }
  .box{ background:#fff; border-radius:20px; padding:32px 24px; text-align:center; max-width:420px; width:100%; border:1px solid var(--line); box-shadow:0 8px 24px -14px rgba(22,34,63,0.3); }
  .spinner{ width:44px; height:44px; border:4px solid var(--line); border-top-color:var(--gold); border-radius:50%; margin:0 auto 20px; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  svg.icon{ width:56px; height:56px; margin-bottom:14px; }
  h2{ font-family:'Fraunces', serif; font-size:1.2rem; margin-bottom:8px; }
  p{ color:var(--text-dim); font-size:0.88rem; margin-bottom:22px; }
  .btn{ display:block; background:var(--gold); color:#14100A; font-weight:700; padding:14px; border-radius:12px; margin-bottom:12px; }
  .affiliate-cta{ background:var(--navy); color:#fff; border-radius:14px; padding:16px; text-align:left; display:flex; align-items:center; gap:12px; margin-top:10px; }
  .affiliate-cta svg{ width:20px; height:20px; flex-shrink:0; }
  .affiliate-cta .txt b{ display:block; font-size:0.88rem; }
  .affiliate-cta .txt span{ display:block; font-size:0.74rem; color:rgba(255,255,255,0.7); margin-top:2px; }
</style>
</head>
<body>

<div class="box" id="box">
  <div class="spinner"></div>
  <h2>Vérification du paiement...</h2>
  <p>Ça ne prend que quelques secondes.</p>
</div>

<script>
  const API_BASE = "https://www.winaffinity.vip";
  const params = new URLSearchParams(window.location.search);
  const contenuId = params.get("contenu_id");
  let checkoutId = localStorage.getItem("winaffinity_last_checkout");
  let attempts = 0;

  async function checkStatus() {
    attempts++;
    if (attempts > 20) {
      renderTimeout();
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/contenus/checkout/${checkoutId}/status`);
      const data = await res.json();

      if (data.statut === "paid") {
        renderSuccess(data.lien_acces);
      } else if (data.statut === "failed" || data.statut === "cancelled") {
        renderFailed();
      } else {
        setTimeout(checkStatus, 2000);
      }
    } catch (e) {
      setTimeout(checkStatus, 2000);
    }
  }

  function renderSuccess(lienAcces) {
    document.getElementById("box").innerHTML = `
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#2FBF8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <h2>Paiement confirmé</h2>
      <p>Ton contenu est prêt.</p>
      ${lienAcces ? `<a href="${lienAcces}" class="btn">Accéder maintenant</a>` : ""}
      <div class="affiliate-cta" onclick="window.location.href='/?register=1'">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <div class="txt"><b>Deviens affilié</b><span>Inscris-toi et gagne 50% en partageant ce contenu</span></div>
      </div>
    `;
  }

  function renderFailed() {
    document.getElementById("box").innerHTML = `
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <h2>Paiement non abouti</h2>
      <p>Le paiement a échoué ou a été annulé.</p>
      <a href="/payer?id=${contenuId}" class="btn">Réessayer</a>
    `;
  }

  function renderTimeout() {
    document.getElementById("box").innerHTML = `
      <h2>Ça prend plus de temps que prévu</h2>
      <p>Si tu as bien payé, ton accès sera confirmé sous peu. Sinon, réessaie.</p>
      <a href="/payer?id=${contenuId}" class="btn">Retour au paiement</a>
    `;
  }

  if (!checkoutId) {
    renderFailed();
  } else {
    checkStatus();
  }
</script>

</body>
</html>
