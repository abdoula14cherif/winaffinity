<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winaffinity — Retrait</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --navy:#0B1A3D; --red:#7A1F2B; --cream:#F3EFE6; --gold:#E8B84B;
    --text-dark:#16223F; --text-dim:#6B7385; --green:#2FBF8F; --line:#E4DFD3; --amber:#C99A2E;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ overflow-x:hidden; max-width:100vw; }
  body{ background:var(--cream); color:var(--text-dark); font-family:'Manrope', sans-serif; min-height:100vh; padding-bottom:40px; }
  a,button{ color:inherit; text-decoration:none; font-family:inherit; border:none; cursor:pointer; background:none; }
  .header{ background: linear-gradient(115deg, var(--navy) 0%, var(--navy) 45%, var(--red) 100%); padding:20px; color:#fff; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:10px; background: rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .header h1{ font-family:'Fraunces', serif; font-size:1.15rem; }
  .wrap{ max-width:520px; margin:0 auto; padding:20px; }

  .solde-card{ background: linear-gradient(115deg, var(--navy), #1a2a5c); border-radius:18px; padding:22px; color:#fff; margin-bottom:20px; }
  .solde-card .label{ font-size:0.78rem; color: rgba(255,255,255,0.65); }
  .solde-card .amount{ font-family:'Fraunces', serif; font-size:2.1rem; margin-top:6px; }
  .solde-card .sub{ font-size:0.75rem; color: rgba(255,255,255,0.5); margin-top:4px; }

  .card{ background:#fff; border-radius:18px; padding:22px; border:1px solid var(--line); box-shadow:0 8px 20px -14px rgba(22,34,63,0.25); margin-bottom:20px; }
  .card h2{ font-family:'Fraunces', serif; font-size:1.05rem; margin-bottom:16px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.78rem; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  .field input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:inherit; font-size:0.92rem; background:var(--cream); }
  .field input:focus{ outline:none; border-color:var(--gold); }

  .country-selector{ display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--cream); cursor:pointer; }
  .country-selector .flag{ font-size:1.6rem; }
  .country-selector .info{ flex:1; }
  .country-selector .name{ font-weight:700; font-size:0.9rem; }
  .country-selector .zone{ font-size:0.72rem; color:var(--text-dim); }
  .country-selector.placeholder .name{ color:var(--text-dim); font-weight:600; }
  .country-selector svg{ width:18px; height:18px; color:var(--text-dim); flex-shrink:0; }

  .operator-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
  .operator-chip{ padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--cream); font-size:0.82rem; font-weight:700; text-align:center; }
  .operator-chip.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .submit-btn{ width:100%; background:var(--gold); color:#14100A; font-weight:800; padding:15px; border-radius:12px; font-size:0.95rem; }
  .submit-btn[disabled]{ opacity:0.5; }

  .msg{ font-size:0.82rem; margin-top:12px; text-align:center; display:none; padding:10px; border-radius:10px; }
  .msg.show{ display:block; }
  .msg.error{ background:#FBE4E4; color:#C0392B; }
  .msg.success{ background:#E4F7EF; color:var(--green); }

  .history-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .history-item:last-child{ border-bottom:none; }
  .history-item .flag{ font-size:1.3rem; }
  .history-item .info{ flex:1; }
  .history-item .amount{ font-weight:700; font-size:0.9rem; }
  .history-item .meta{ font-size:0.74rem; color:var(--text-dim); }
  .status-badge{ font-size:0.68rem; font-weight:800; padding:4px 10px; border-radius:999px; text-transform:uppercase; }
  .status-en_attente{ background:#FBF0D8; color:var(--amber); }
  .status-approuve{ background:#E4F7EF; color:var(--green); }
  .status-rejete{ background:#FBE4E4; color:#C0392B; }
  .empty-history{ text-align:center; color:var(--text-dim); font-size:0.85rem; padding:20px 0; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(11,26,61,0.6); z-index:100; align-items:flex-end; justify-content:center; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px 0 10px; max-height:78vh; display:flex; flex-direction:column; }
  .modal-head{ padding:0 20px 14px; display:flex; align-items:center; justify-content:space-between; }
  .modal-head h3{ font-family:'Fraunces', serif; font-size:1.05rem; }
  .modal-close{ width:30px; height:30px; border-radius:8px; background:var(--cream); display:flex; align-items:center; justify-content:center; }
  .zone-label{ padding:10px 20px 6px; font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); }
  .country-list{ overflow-y:auto; padding-bottom:10px; }
  .country-row{ display:flex; align-items:center; gap:14px; padding:12px 20px; }
  .country-row:active{ background:var(--cream); }
  .country-row .flag{ font-size:1.5rem; }
  .country-row .name{ font-weight:600; font-size:0.9rem; flex:1; }
  .badge-unconfirmed{ font-size:0.6rem; font-weight:700; color:var(--text-dim); background:var(--cream); padding:2px 8px; border-radius:999px; }
</style>
</head>
<body>

<div class="header">
  <a href="/dashboard" class="back-btn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </a>
  <h1>Retrait</h1>
</div>

<div class="wrap">

  <div class="solde-card">
    <div class="label">Solde disponible</div>
    <div class="amount" id="soldeDisponible">— F CFA</div>
    <div class="sub">Minimum de retrait : 1 000 F CFA</div>
  </div>

  <div class="card">
    <h2>Nouvelle demande</h2>
    <form id="retraitForm" onsubmit="return submitRetrait(event)">

      <div class="field">
        <label>Pays</label>
        <div class="country-selector placeholder" id="countrySelector" onclick="openCountryModal()">
          <div class="flag" id="selectedFlag">🌍</div>
          <div class="info">
            <div class="name" id="selectedCountryName">Choisir un pays</div>
            <div class="zone" id="selectedZone"></div>
          </div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <div class="field" id="operatorField" style="display:none;">
        <label>Opérateur</label>
        <div class="operator-grid" id="operatorGrid"></div>
      </div>

      <div class="field">
        <label>Numéro de téléphone (mobile money)</label>
        <input type="tel" id="telephone" placeholder="+225 07 00 00 00 00" required>
      </div>

      <div class="field">
        <label>Montant à retirer (F CFA)</label>
        <input type="number" id="montant" min="1000" required>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Envoyer la demande</button>
      <div class="msg" id="formMsg"></div>
    </form>
  </div>

  <div class="card">
    <h2>Historique</h2>
    <div id="historyList"></div>
  </div>

</div>

<div class="modal-overlay" id="countryModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Choisir un pays</h3>
      <div class="modal-close" onclick="closeCountryModal()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
    <div class="country-list" id="countryList"></div>
  </div>
</div>

<script>
  const API_BASE = "https://www.winaffinity.vip";
  const token = localStorage.getItem("winaffinity_token");
  if (!token) { window.location.href = "/"; }

  const COUNTRIES = [
    { zone: "Zone XOF — LeekPay", flag: "🇧🇯", name: "Bénin", code: "BJ", operators: ["MTN Money", "Moov Money"], confirmed: true },
    { zone: "Zone XOF — LeekPay", flag: "🇧🇫", name: "Burkina Faso", code: "BF", operators: ["Orange Money", "Moov Money"], confirmed: true },
    { zone: "Zone XOF — LeekPay", flag: "🇨🇮", name: "Côte d'Ivoire", code: "CI", operators: ["Orange Money", "MTN Money", "Moov Money", "Wave"], confirmed: true },
    { zone: "Zone XOF — LeekPay", flag: "🇬🇼", name: "Guinée-Bissau", code: "GW", operators: ["Orange Money"], confirmed: true },
    { zone: "Zone XOF — LeekPay", flag: "🇲🇱", name: "Mali", code: "ML", operators: ["Orange Money", "Moov Money"], confirmed: true },
    { zone: "Zone XOF — LeekPay", flag: "🇳🇪", name: "Niger", code: "NE", operators: ["Orange Money", "Moov Money", "Airtel Money"], confirmed: true },
    { zone: "Zone XOF — LeekPay", flag: "🇸🇳", name: "Sénégal", code: "SN", operators: ["Orange Money", "Wave", "Free Money"], confirmed: true },
    { zone: "Zone XOF — LeekPay", flag: "🇹🇬", name: "Togo", code: "TG", operators: ["Togocom Money", "Moov Money"], confirmed: true },
    { zone: "Zone XAF — SoleasPay", flag: "🇨🇲", name: "Cameroun", code: "CM", operators: ["Orange Money", "MTN MoMo"], confirmed: true },
    { zone: "Zone XAF — SoleasPay", flag: "🇬🇦", name: "Gabon", code: "GA", operators: ["Airtel Money", "Moov Money"], confirmed: false },
    { zone: "Zone XAF — SoleasPay", flag: "🇹🇩", name: "Tchad", code: "TD", operators: ["Airtel Money", "Moov Money"], confirmed: false },
    { zone: "Zone XAF — SoleasPay", flag: "🇨🇬", name: "Congo", code: "CG", operators: ["Airtel Money", "MTN Money"], confirmed: false },
    { zone: "Zone XAF — SoleasPay", flag: "🇨🇫", name: "Centrafrique", code: "CF", operators: ["Orange Money"], confirmed: false },
    { zone: "Zone XAF — SoleasPay", flag: "🇬🇶", name: "Guinée équatoriale", code: "GQ", operators: ["Orange Money"], confirmed: false },
  ];

  let selectedCountry = null;
  let selectedOperator = null;

  function openCountryModal() {
    const list = document.getElementById("countryList");
    list.innerHTML = "";
    let currentZone = "";
    COUNTRIES.forEach(c => {
      if (c.zone !== currentZone) {
        currentZone = c.zone;
        const zoneLabel = document.createElement("div");
        zoneLabel.className = "zone-label";
        zoneLabel.textContent = currentZone;
        list.appendChild(zoneLabel);
      }
      const row = document.createElement("div");
      row.className = "country-row";
      row.onclick = () => selectCountry(c);
      row.innerHTML = `
        <div class="flag">${c.flag}</div>
        <div class="name">${c.name}</div>
        ${!c.confirmed ? '<div class="badge-unconfirmed">à confirmer</div>' : ''}
      `;
      list.appendChild(row);
    });
    document.getElementById("countryModal").classList.add("open");
  }

  function closeCountryModal() {
    document.getElementById("countryModal").classList.remove("open");
  }

  function selectCountry(country) {
    selectedCountry = country;
    selectedOperator = null;

    const selector = document.getElementById("countrySelector");
    selector.classList.remove("placeholder");
    document.getElementById("selectedFlag").textContent = country.flag;
    document.getElementById("selectedCountryName").textContent = country.name;
    document.getElementById("selectedZone").textContent = country.zone;

    const opField = document.getElementById("operatorField");
    const opGrid = document.getElementById("operatorGrid");
    opGrid.innerHTML = "";
    country.operators.forEach(op => {
      const chip = document.createElement("div");
      chip.className = "operator-chip";
      chip.textContent = op;
      chip.onclick = () => selectOperator(op, chip);
      opGrid.appendChild(chip);
    });
    opField.style.display = "block";

    closeCountryModal();
  }

  function selectOperator(op, el) {
    selectedOperator = op;
    document.querySelectorAll(".operator-chip").forEach(c => c.classList.remove("active"));
    el.classList.add("active");
  }

  async function loadSolde() {
    try {
      const res = await fetch(`${API_BASE}/retraits/solde-disponible`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      document.getElementById("soldeDisponible").textContent = `${data.solde.toLocaleString('fr-FR')} F CFA`;
    } catch (e) {}
  }

  async function loadHistory() {
    const listEl = document.getElementById("historyList");
    try {
      const res = await fetch(`${API_BASE}/retraits/mes`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.length === 0) {
        listEl.innerHTML = '<div class="empty-history">Aucune demande de retrait pour l\'instant.</div>';
        return;
      }
      listEl.innerHTML = "";
      data.forEach(r => {
        const country = COUNTRIES.find(c => c.code === r.pays) || {};
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div class="flag">${country.flag || "🌍"}</div>
          <div class="info">
            <div class="amount">${r.montant.toLocaleString('fr-FR')} F CFA</div>
            <div class="meta">${r.operateur} · ${new Date(r.created_at).toLocaleDateString('fr-FR')}</div>
          </div>
          <div class="status-badge status-${r.statut}">${r.statut.replace('_', ' ')}</div>
        `;
        listEl.appendChild(div);
      });
    } catch (e) {
      listEl.innerHTML = '<div class="empty-history">Erreur de chargement.</div>';
    }
  }

  async function submitRetrait(e) {
    e.preventDefault();
    const msg = document.getElementById("formMsg");
    const submitBtn = document.getElementById("submitBtn");

    if (!selectedCountry) { msg.className = "msg error show"; msg.textContent = "Choisis un pays."; return; }
    if (!selectedOperator) { msg.className = "msg error show"; msg.textContent = "Choisis un opérateur."; return; }

    const payload = {
      montant: parseInt(document.getElementById("montant").value),
      pays: selectedCountry.code,
      operateur: selectedOperator,
      telephone: document.getElementById("telephone").value,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "Envoi...";

    try {
      const res = await fetch(`${API_BASE}/retraits/demander`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Erreur");

      msg.className = "msg success show";
      msg.textContent = "Demande envoyée ! Elle sera traitée sous peu.";
      document.getElementById("retraitForm").reset();
      selectedCountry = null;
      selectedOperator = null;
      document.getElementById("countrySelector").classList.add("placeholder");
      document.getElementById("selectedFlag").textContent = "🌍";
      document.getElementById("selectedCountryName").textContent = "Choisir un pays";
      document.getElementById("selectedZone").textContent = "";
      document.getElementById("operatorField").style.display = "none";

      loadSolde();
      loadHistory();
    } catch (err) {
      msg.className = "msg error show";
      msg.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Envoyer la demande";
    }
  }

  loadSolde();
  loadHistory();
</script>

</body>
</html>
