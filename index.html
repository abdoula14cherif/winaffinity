<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Network</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#075E54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Affinity">
<meta name="description" content="Accomplis des tâches, gagne de l'argent et grandis avec ton réseau.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --wa-green: #25D366; --wa-dark: #128C7E; --wa-deep: #075E54; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--wa-deep); color: #fff;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px; overflow: hidden;
  }
  .bg-shape { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .3; z-index: 0; }
  .bg-shape.a { width: 280px; height: 280px; background: var(--wa-green); top: -80px; right: -80px; animation: float 8s ease-in-out infinite; }
  .bg-shape.b { width: 240px; height: 240px; background: #FF6A00; bottom: -70px; left: -80px; animation: float 10s ease-in-out infinite reverse; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-20px) scale(1.1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 8px 30px rgba(37,211,102,.35); } 50% { transform: scale(1.05); box-shadow: 0 10px 40px rgba(37,211,102,.5); } }

  .container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 22px; animation: fadeUp .7s ease; }
  .logo { width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg, var(--wa-dark), var(--wa-green)); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(37,211,102,.35); animation: pulse 2.2s ease-in-out infinite; }
  .logo svg { stroke: #fff; }
  .name { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .name span { color: var(--wa-green); }
  .tagline { font-size: 14px; opacity: .7; text-align: center; max-width: 280px; line-height: 1.5; }
  .spinner { width: 34px; height: 34px; border: 3.5px solid rgba(255,255,255,.2); border-top-color: var(--wa-green); border-radius: 50%; animation: spin .9s linear infinite; margin-top: 6px; }
  .status { font-size: 13px; opacity: .6; letter-spacing: .3px; }
</style>
</head>
<body>

  <div class="bg-shape a"></div>
  <div class="bg-shape b"></div>

  <div class="container">
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v6M12 22v-4M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M2 12h6M22 12h-4M4.93 19.07l4.24-4.24M14.83 9.17l4.24-4.24"/>
      </svg>
    </div>
    <div class="name">Affinity<span> Network</span></div>
    <div class="tagline">Accomplis des tâches. Gagne. Grandis avec ton réseau.</div>
    <div class="spinner"></div>
    <div class="status" id="status">Vérification de la session...</div>
  </div>

<script>
  const SUPABASE_URL = 'https://ydwjvvlcnqsftciedpqm.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd2p2dmxjbnFzZnRjaWVkcHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDQyNDAsImV4cCI6MjEwNTY4MDI0MH0.4uQwBGedMBjUZErd8lUM5YfA26gw96RvHdo_J-3PZCY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  (async function init() {
    try {
      const { data: { session } } = await sb.auth.getSession();

      if (session) {
        document.getElementById('status').textContent = 'Connexion en cours...';
        setTimeout(() => window.location.replace('dashboard.html'), 700);
      } else {
        document.getElementById('status').textContent = 'Redirection...';
        setTimeout(() => window.location.replace('inscription.html'), 700);
      }
    } catch (err) {
      console.warn('Erreur session:', err);
      document.getElementById('status').textContent = 'Redirection...';
      setTimeout(() => window.location.replace('inscription.html'), 900);
    }
  })();
</script>
</body>
</html>
