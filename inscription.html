<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#075E54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Affinity">
<link rel="icon" type="image/png" href="https://i.ibb.co/996nZCn7/file-000000000e4481f49ce58934aa6b6a51.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/996nZCn7/file-000000000e4481f49ce58934aa6b6a51.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function() {
    document.addEventListener('click', function(e) {
      const link = e.target.closest('a');
      if (!link) return;
      let href = link.getAttribute('href');
      if (!href) return;
      if (href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return;
      if (href.endsWith('.html')) {
        e.preventDefault();
        window.location.href = href.replace(/\.html$/, '');
      }
    }, true);
    if (window.location.pathname.endsWith('.html')) {
      window.history.replaceState(null, '', window.location.pathname.replace(/\.html$/, '') + window.location.search);
    }
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --wa-green: #25D366;
    --wa-dark: #128C7E;
    --wa-deep: #075E54;
    --alibaba: #FF6A00;
    --gold: #FFB800;
    --white: #ffffff;
    --bg: #f7f9f8;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #dc2626;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
  }
  input { -webkit-user-select: text; user-select: text; }

  /* ============ LOADER ============ */
  .loader {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, var(--wa-deep) 0%, var(--wa-dark) 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    transition: opacity .6s ease, visibility .6s ease;
  }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader-logo-img {
    width: 100px; height: 100px;
    object-fit: contain;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.3));
    animation: scaleIn .8s ease;
  }
  .loader-logo-txt {
    font-size: 22px; font-weight: 800; color: #fff;
    letter-spacing: 1.5px;
  }
  .loader-logo-txt span { color: var(--wa-green); }
  .spinner {
    width: 46px; height: 46px;
    border: 4px solid rgba(255,255,255,.2);
    border-top-color: var(--wa-green);
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(.7); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ============ ANIMATIONS ============ */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 0 0 rgba(37,211,102,.4); }
    50% { box-shadow: 0 0 0 8px rgba(37,211,102,0); }
  }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(20px,-20px) scale(1.08); }
  }
  .anim { opacity: 0; animation: fadeInUp .5s ease forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; }
  .d3 { animation-delay: .20s; } .d4 { animation-delay: .28s; }
  .d5 { animation-delay: .36s; } .d6 { animation-delay: .44s; }
  .d7 { animation-delay: .52s; } .d8 { animation-delay: .60s; }

  /* ============ DÉCOR ============ */
  .bg-shape {
    position: fixed; border-radius: 50%;
    z-index: -1; filter: blur(70px); opacity: .3;
    pointer-events: none;
  }
  .bg-shape.a {
    width: 300px; height: 300px; background: var(--wa-green);
    top: -100px; right: -100px;
    animation: float 9s ease-in-out infinite;
  }
  .bg-shape.b {
    width: 260px; height: 260px; background: var(--alibaba);
    bottom: -80px; left: -100px;
    animation: float 11s ease-in-out infinite reverse;
  }

  /* ============ PAGE ============ */
  .page {
    min-height: 100vh;
    display: flex; flex-direction: column;
    padding: 24px 20px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto;
    width: 100%;
  }

  /* ============ LOGO EN HAUT ============ */
  .brand {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    text-align: center;
  }
  .brand-img-wrap {
    width: 96px; height: 96px;
    background: #fff;
    border-radius: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(7,94,84,.15), 0 2px 8px rgba(0,0,0,.05);
    padding: 8px;
    position: relative;
    overflow: hidden;
  }
  .brand-img-wrap::before {
    content: ''; position: absolute;
    inset: 0; border-radius: 26px;
    background: linear-gradient(135deg, rgba(37,211,102,.08), rgba(255,106,0,.05));
    pointer-events: none;
  }
  .brand-img-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    position: relative; z-index: 2;
  }
  .brand-name {
    font-size: 22px; font-weight: 800;
    color: var(--wa-deep);
    letter-spacing: .5px;
  }
  .brand-name span { color: var(--wa-green); }
  .brand-tagline {
    font-size: 12.5px; color: var(--muted);
    font-weight: 500;
  }

  /* ============ CARTE FORM ============ */
  .form-card {
    background: #fff;
    border-radius: 28px;
    padding: 24px 22px;
    box-shadow: 0 12px 40px rgba(7,94,84,.1), 0 4px 12px rgba(0,0,0,.04);
    position: relative;
  }

  /* ============ TABS ============ */
  .tabs {
    display: flex; background: #f0f4f2;
    border-radius: 16px; padding: 5px;
    margin-bottom: 22px; position: relative;
  }
  .tab {
    flex: 1; text-align: center;
    padding: 12px 0; cursor: pointer;
    font-size: 14px; font-weight: 700;
    color: var(--muted); z-index: 2;
    transition: color .3s; position: relative;
  }
  .tab.active { color: #fff; }
  .tab-indicator {
    position: absolute; top: 5px; bottom: 5px;
    width: calc(50% - 5px); left: 5px;
    background: linear-gradient(135deg, var(--wa-dark), var(--wa-green));
    border-radius: 12px;
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 4px 12px rgba(18,140,126,.3);
  }
  .tab-indicator.right { transform: translateX(100%); }

  /* ============ FORM ============ */
  .form { display: flex; flex-direction: column; gap: 14px; }
  .field { position: relative; }
  .field label {
    display: block; font-size: 12.5px; font-weight: 700;
    color: var(--wa-deep); margin-bottom: 7px;
    letter-spacing: .2px;
  }
  .field .input-wrap {
    display: flex; align-items: center;
    background: #f7faf8; border: 1.5px solid #eef2f0;
    border-radius: 14px; padding: 0 14px;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field .input-wrap:focus-within {
    border-color: var(--wa-green);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(37,211,102,.12);
  }
  .field .input-wrap.prefilled {
    background: linear-gradient(135deg, rgba(37,211,102,.08), rgba(18,140,126,.1));
    border-color: var(--wa-green);
    animation: glow 2s ease-in-out infinite;
  }
  .field .input-wrap svg {
    stroke: var(--muted); flex-shrink: 0;
    transition: stroke .2s;
  }
  .field .input-wrap:focus-within svg { stroke: var(--wa-dark); }
  .field .input-wrap.prefilled svg { stroke: var(--wa-green); }
  .field input {
    flex: 1; border: none; outline: none;
    padding: 14px 10px; font-size: 15px;
    background: transparent; color: var(--text);
    font-family: inherit;
    font-weight: 500;
  }
  .field input::placeholder { color: #b0b7be; font-weight: 400; }
  .field input.uppercase { text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }

  .toggle-pass {
    cursor: pointer; padding: 6px;
    display: flex; align-items: center;
    border-radius: 8px;
    transition: background .2s;
  }
  .toggle-pass:active { background: #eef2f0; }
  .toggle-pass svg { stroke: var(--muted); }

  /* ============ BADGE PARRAINAGE ============ */
  .ref-badge {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    background: var(--wa-green); color: #fff;
    font-size: 10px; font-weight: 800;
    padding: 4px 9px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: .3px;
    display: none;
    pointer-events: none;
  }
  .ref-badge.show { display: inline-block; }

  .ref-info {
    background: linear-gradient(135deg, rgba(37,211,102,.08), rgba(18,140,126,.1));
    border: 1px solid rgba(37,211,102,.3);
    border-radius: 14px;
    padding: 13px 15px;
    display: none;
    align-items: center; gap: 10px;
    font-size: 12px; color: var(--wa-deep);
    line-height: 1.5;
    margin-top: -6px;
  }
  .ref-info.show { display: flex; animation: fadeInUp .4s ease; }
  .ref-info svg { stroke: var(--wa-green); flex-shrink: 0; }

  /* ============ BOUTON PRINCIPAL ============ */
  .btn-primary {
    margin-top: 10px;
    background: linear-gradient(135deg, var(--wa-dark), var(--wa-green));
    color: #fff; border: none;
    padding: 17px; border-radius: 16px;
    font-size: 16px; font-weight: 800;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 24px rgba(18,140,126,.35);
    transition: transform .15s, box-shadow .2s;
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    letter-spacing: .3px;
  }
  .btn-primary:active { transform: scale(.97); box-shadow: 0 4px 12px rgba(18,140,126,.4); }
  .btn-primary:disabled { opacity: .7; cursor: not-allowed; }
  .btn-primary .btn-loader {
    display: none; width: 20px; height: 20px;
    border: 2.5px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .btn-primary.loading .btn-loader { display: inline-block; }
  .btn-primary.loading .btn-text { opacity: .9; }

  /* ============ SWITCH ============ */
  .switch-line {
    text-align: center; font-size: 14px;
    color: var(--muted); margin-top: 22px;
    padding-top: 20px;
    border-top: 1px dashed #eef2f0;
  }
  .switch-line b {
    color: var(--wa-dark); cursor: pointer;
    font-weight: 800;
  }
  .switch-line b:active { opacity: .7; }

  /* ============ TERMS ============ */
  .terms {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 12px; color: var(--muted);
    margin-top: 4px; line-height: 1.55;
    padding: 4px 0;
  }
  .terms input {
    margin-top: 2px; accent-color: var(--wa-green);
    width: 18px; height: 18px; cursor: pointer;
    flex-shrink: 0;
  }
  .terms a {
    color: var(--alibaba); text-decoration: none;
    font-weight: 700;
  }

  /* ============ MESSAGE ============ */
  .msg {
    padding: 13px 15px; border-radius: 12px;
    font-size: 13px; font-weight: 600;
    display: none;
    line-height: 1.4;
  }
  .msg.show { display: block; animation: shake .4s ease; }
  .msg.error { background: #fee2e2; color: #b91c1c; }
  .msg.success {
    background: #dcfce7; color: #166534;
    animation: fadeInUp .4s ease;
    display: flex; align-items: center; gap: 8px;
  }
  .msg.success svg { stroke: #166534; flex-shrink: 0; }

  /* ============ FOOTER ============ */
  .bottom-note {
    text-align: center;
    margin-top: 24px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.6;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .bottom-note svg { stroke: var(--wa-green); flex-shrink: 0; }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <!-- LOADER -->
  <div class="loader" id="loader">

    <div class="loader-logo-txt">Affinity<span> Network</span></div>
    <div class="spinner"></div>
  </div>

  <!-- DÉCOR -->
  <div class="bg-shape a"></div>
  <div class="bg-shape b"></div>

  <div class="page">

    <!-- LOGO EN HAUT -->
    <div class="brand anim d1">
      <div class="brand-img-wrap">
        <img src="https://i.ibb.co/996nZCn7/file-000000000e4481f49ce58934aa6b6a51.png" alt="Affinity Network">
      </div>
      <div class="brand-name">Affinity<span> Network</span></div>

      <div class="msg" id="msgBox"></div>

      <form class="form" id="authForm" onsubmit="return handleSubmit(event)">

        <div class="field" id="fieldNom">

          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            </svg>
            <input type="text" id="nom" placeholder="Ex: Jean Kamga" autocomplete="name">
          </div>

        <!-- Pseudo -->
        <div class="field">
          <label>Pseudo</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <!-- Email -->
        <div class="field">

        <!-- Mot de passe -->
        <div class="field">

          <div class="input-wrap">

              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <div class="field" id="fieldParrainage">

          <div class="input-wrap" id="wrapParrainage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <input type="text" id="codeParrainage" placeholder="Ex: AFF123ABC" class="uppercase" maxlength="20" oninput="onRefInput()">
            <span class="ref-badge" id="refBadge">Détecté</span>
          </div>
          <div class="ref-info" id="refInfo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>

            <span>Tu as été invité par un parrain. Active un plan et fais-lui gagner <b>20%</b> de commission.</span>
          </div>
        </div>

        <!-- Conditions -->
        <div class="terms" id="fieldTerms">
          <input type="checkbox" id="terms">
          <label for="terms" style="margin:0;text-transform:none;letter-spacing:0;font-weight:500;">
            J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a> d'Affinity Network.
          </label>
        </div>

        <!-- Bouton -->
        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-loader"></span>
          <span class="btn-text" id="btnText">Créer mon compte</span>
        </button>
      </form>

      <!-- Switch -->
      <div class="switch-line" id="switchLine">
        Déjà un compte ? <b onclick="switchTab('login')">Se connecter</b>
      </div>

    </div>

    <!-- NOTE BAS DE PAGE -->
    <div class="bottom-note anim d3">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Tes données sont chiffrées et sécurisées
    </div>

  </div>

<script>
  // ================= SUPABASE =================
  const SUPABASE_URL = 'https://ydwjvvlcnqsftciedpqm.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd2p2dmxjbnFzZnRjaWVkcHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDQyNDAsImV4cCI6MjEwNTY4MDI0MH0.4uQwBGedMBjUZErd8lUM5YfA26gw96RvHdo_J-3PZCY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // ================= SERVICE WORKER =================
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  // ================= CAPTURE CODE PARRAINAGE =================
  const urlParams = new URLSearchParams(window.location.search);
  const refFromURL = (urlParams.get('ref') || '').trim().toUpperCase();

  function applyRefFromURL() {
    if (!refFromURL) return;
    const input = document.getElementById('codeParrainage');
    const wrap = document.getElementById('wrapParrainage');
    const badge = document.getElementById('refBadge');
    const info = document.getElementById('refInfo');
    if (input) {
      input.value = refFromURL;
      wrap.classList.add('prefilled');
      badge.classList.add('show');
      info.classList.add('show');
    }
  }

  function onRefInput() {
    const input = document.getElementById('codeParrainage');
    const wrap = document.getElementById('wrapParrainage');
    const badge = document.getElementById('refBadge');
    const info = document.getElementById('refInfo');
    input.value = input.value.toUpperCase();
    if (input.value.length >= 6) {
      wrap.classList.add('prefilled');
      badge.classList.add('show');
      info.classList.add('show');
    } else {
      wrap.classList.remove('prefilled');
      badge.classList.remove('show');
      info.classList.remove('show');
    }
  }

  // ================= LOADER + SESSION =================
  window.addEventListener('load', async () => {
    applyRefFromURL();

    const { data: { session } } = await sb.auth.getSession();
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
      if (session) {
        window.location.replace('dashboard');
      }
    }, 1200);
  });

  // ================= MODE =================
  let mode = 'signup';

  function switchTab(m) {
    mode = m;
    const indicator = document.getElementById('tabIndicator');
    const tabSignup = document.getElementById('tabSignup');
    const tabLogin = document.getElementById('tabLogin');
    const brandTagline = document.getElementById('brandTagline');
    const fieldNom = document.getElementById('fieldNom');
    const fieldParrainage = document.getElementById('fieldParrainage');
    const fieldTerms = document.getElementById('fieldTerms');
    const btnText = document.getElementById('btnText');
    const switchLine = document.getElementById('switchLine');
    const password = document.getElementById('password');

    if (m === 'signup') {
      indicator.classList.remove('right');
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      brandTagline.textContent = 'Rejoins la communauté et commence à gagner';
      fieldNom.classList.remove('hidden');
      fieldParrainage.classList.remove('hidden');
      fieldTerms.classList.remove('hidden');
      btnText.textContent = 'Créer mon compte';
      switchLine.innerHTML = 'Déjà un compte ? <b onclick="switchTab(\'login\')">Se connecter</b>';
      password.autocomplete = 'new-password';
    } else {
      indicator.classList.add('right');
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      brandTagline.textContent = 'Ravi de te revoir !';
      fieldNom.classList.add('hidden');
      fieldParrainage.classList.add('hidden');
      fieldTerms.classList.add('hidden');
      btnText.textContent = 'Se connecter';
      switchLine.innerHTML = 'Pas encore de compte ? <b onclick="switchTab(\'signup\')">S\'inscrire</b>';
      password.autocomplete = 'current-password';
    }
    hideMsg();
  }

  // ================= PASSWORD =================
  function togglePassword() {
    const p = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (p.type === 'password') {
      p.type = 'text';
      icon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>';
    } else {
      p.type = 'password';
      icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  // ================= MESSAGES =================
  function showMsg(text, type = 'error') {
    const e = document.getElementById('msgBox');
    if (type === 'success') {
      e.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>${text}</span>`;
    } else {
      e.textContent = text;
    }
    e.className = 'msg show ' + type;
  }
  function hideMsg() {
    document.getElementById('msgBox').className = 'msg';
    document.getElementById('msgBox').innerHTML = '';
  }

  // ================= SOUMISSION =================
  async function handleSubmit(e) {
    e.preventDefault();
    hideMsg();

    const nom = document.getElementById('nom').value.trim();
    const pseudo = document.getElementById('pseudo').value.trim().toLowerCase();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const terms = document.getElementById('terms').checked;
    const codeRef = document.getElementById('codeParrainage').value.trim().toUpperCase();
    const btn = document.getElementById('submitBtn');

    if (mode === 'signup') {
      if (nom.length < 3) return showMsg('Entre ton nom complet (3 caractères min).'), false;
      if (pseudo.length < 3) return showMsg('Le pseudo doit contenir au moins 3 caractères.'), false;
      if (!/^[a-z0-9._-]+$/.test(pseudo)) return showMsg('Pseudo : lettres minuscules, chiffres, . _ - seulement.'), false;
    }
    if (!email) return showMsg('Entre ton email.'), false;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg('Entre un email valide.'), false;
    if (password.length < 6) return showMsg('Le mot de passe doit contenir au moins 6 caractères.'), false;
    if (mode === 'signup' && !terms) return showMsg('Tu dois accepter les conditions.'), false;

    btn.classList.add('loading');
    btn.disabled = true;
    document.getElementById('btnText').textContent = mode === 'signup' ? 'Inscription...' : 'Connexion...';

    try {
      if (mode === 'signup') {
        await signUp(nom, pseudo, email, password, codeRef);
      } else {
        await signIn(email, password);
      }
    } catch (err) {
      showMsg(err.message || 'Une erreur est survenue.');
      btn.classList.remove('loading');
      btn.disabled = false;
      document.getElementById('btnText').textContent = mode === 'signup' ? 'Créer mon compte' : 'Se connecter';
    }

    return false;
  }

  // ================= INSCRIPTION =================
  async function signUp(nom, pseudo, email, password, codeRef) {
    // 1. Vérifier le pseudo
    const { data: existing } = await sb
      .from('profiles').select('pseudo').eq('pseudo', pseudo).maybeSingle();
    if (existing) throw new Error('Ce pseudo est déjà pris. Choisis-en un autre.');

    // 2. Résoudre le code de parrainage si fourni
    let parrainId = null;
    if (codeRef && codeRef.length > 0) {
      const { data: pid, error: refErr } = await sb.rpc('resoudre_code_parrainage', { p_code: codeRef });
      if (refErr) console.warn('Erreur résolution code:', refErr);
      if (!pid) throw new Error('Code de parrainage invalide ou inexistant.');
      parrainId = pid;
    }

    // 3. Créer le compte Supabase Auth
    const { data, error } = await sb.auth.signUp({
      email: email,
      password: password,
      options: { data: { nom, pseudo } }
    });

    if (error) throw new Error(traduireErreur(error.message));

    if (!data.session) {
      showMsg('Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse.', 'success');
      setTimeout(() => {
        switchTab('login');
        document.getElementById('btnText').textContent = 'Se connecter';
      }, 3000);
      return;
    }

    // 4. Insérer le profil
    const { error: profileError } = await sb
      .from('profiles')
      .insert({
        id: data.user.id,
        nom: nom,
        pseudo: pseudo,
        email: email,
        solde: 0,
        parrain_id: parrainId
      });

    if (profileError) console.warn('Erreur insertion profil:', profileError);

    // 5. Redirection
    showMsg('Inscription réussie ! Redirection...', 'success');
    setTimeout(() => window.location.href = 'dashboard', 1200);
  }

  // ================= CONNEXION =================
  async function signIn(email, password) {
    const { data, error } = await sb.auth.signInWithPassword({
      email: email, password: password
    });
    if (error) throw new Error(traduireErreur(error.message));
    showMsg('Connexion réussie ! Redirection...', 'success');
    setTimeout(() => window.location.href = 'dashboard', 900);
  }

  // ================= TRADUCTION =================
  function traduireErreur(msg) {
    const m = msg.toLowerCase();
    if (m.includes('invalid login')) return 'Email ou mot de passe incorrect.';
    if (m.includes('email not confirmed')) return 'Confirme ton email avant de te connecter.';
    if (m.includes('user already registered')) return 'Cet email est déjà utilisé.';
    if (m.includes('password should be')) return 'Le mot de passe est trop court (6 caractères min).';
    if (m.includes('unable to validate email')) return 'Adresse email invalide.';
    if (m.includes('rate limit')) return 'Trop de tentatives. Réessaie dans quelques minutes.';
    return msg;
  }
</script>
