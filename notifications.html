<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Network — Notifications</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#075E54">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --wa-green: #25D366; --wa-dark: #128C7E; --wa-deep: #075E54;
    --alibaba: #FF6A00; --bg: #f7f9f8; --text: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
  }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; -webkit-user-select: none; user-select: none; }

  .loader { position: fixed; inset: 0; z-index: 9999; background: var(--wa-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .6s ease, visibility .6s ease; }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader-logo { font-size: 24px; font-weight: 700; color: #fff; }
  .loader-logo span { color: var(--wa-green); }
  .spinner { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--wa-green); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .anim { opacity: 0; animation: fadeInUp .4s ease forwards; }

  .header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--wa-deep); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); padding-top: max(14px, env(safe-area-inset-top)); }
  .burger { cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.12); }
  .burger svg { stroke: #fff; }
  .logo { font-weight: 700; font-size: 18px; }
  .logo span { color: var(--wa-green); }
  .btn-mark { background: rgba(255,255,255,.15); border: none; color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .btn-mark:active { transform: scale(.95); }
  .btn-mark svg { stroke: #fff; }

  .menu { position: fixed; top: 0; left: 0; height: 100%; width: 280px; background: #fff; z-index: 200; transform: translateX(-100%); transition: transform .35s cubic-bezier(.4,0,.2,1); box-shadow: 4px 0 20px rgba(0,0,0,.2); padding-top: 18px; display: flex; flex-direction: column; overflow-y: auto; padding-top: max(18px, env(safe-area-inset-top)); }
  .menu.open { transform: translateX(0); }
  .menu-header { padding: 8px 20px 18px; border-bottom: 1px solid #eee; margin-bottom: 10px; font-weight: 700; color: var(--wa-deep); font-size: 17px; display: flex; align-items: center; gap: 10px; }
  .menu-header svg { stroke: var(--wa-green); }
  .menu-item { display: flex; align-items: center; gap: 14px; padding: 15px 22px; cursor: pointer; font-size: 15px; color: #333; }
  .menu-item svg { stroke: var(--wa-dark); flex-shrink: 0; }
  .menu-item.active { background: #e7f9ee; color: var(--wa-deep); font-weight: 700; }
  .menu-footer { margin-top: auto; padding: 16px 20px 22px; border-top: 1px solid #eee; padding-bottom: max(22px, env(safe-area-inset-bottom)); }
  .btn-logout { width: 100%; padding: 14px; background: #fee2e2; color: #b91c1c; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-logout svg { stroke: #b91c1c; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .content { padding: 18px 16px; }
  .page-title { font-size: 24px; font-weight: 800; color: var(--wa-deep); margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .page-sub .badge-nl { background: linear-gradient(135deg, var(--alibaba), #FF8A3D); color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 800; }

  .push-banner { background: linear-gradient(135deg, var(--wa-deep), var(--wa-dark)); color: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 14px rgba(7,94,84,.25); }
  .push-banner .pb-icon { width: 42px; height: 42px; border-radius: 50%; background: rgba(37,211,102,.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .push-banner .pb-icon svg { stroke: var(--wa-green); }
  .push-banner .pb-body { flex: 1; }
  .push-banner .pb-title { font-size: 13.5px; font-weight: 800; margin-bottom: 2px; }
  .push-banner .pb-sub { font-size: 11px; opacity: .85; }
  .push-banner .pb-btn { background: var(--wa-green); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 800; cursor: pointer; font-family: inherit; flex-shrink: 0; }
  .push-banner .pb-btn:active { transform: scale(.95); }

  .notif-item { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); display: flex; gap: 12px; animation: fadeInUp .4s ease forwards; opacity: 0; position: relative; border-left: 4px solid transparent; cursor: pointer; }
  .notif-item:active { transform: scale(.98); }
  .notif-item.unread { border-left-color: var(--wa-green); background: linear-gradient(to right, rgba(37,211,102,.05), #fff); }
  .notif-item.unread::after { content: ''; position: absolute; top: 14px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--wa-green); box-shadow: 0 0 0 4px rgba(37,211,102,.2); }
  .notif-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--wa-dark), var(--wa-green)); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .notif-body { flex: 1; min-width: 0; padding-right: 16px; }
  .notif-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  .notif-message { font-size: 13px; color: #4b5563; line-height: 1.5; margin-bottom: 6px; word-wrap: break-word; }
  .notif-time { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .notif-time svg { stroke: var(--muted); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .empty svg { stroke: #d1d5db; margin-bottom: 12px; }
  .empty .em-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
  .empty .em-sub { font-size: 12.5px; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #e5e7eb; box-shadow: 0 -2px 12px rgba(0,0,0,.06); z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 9px 0 10px; cursor: pointer; color: #9ca3af; font-size: 11px; gap: 4px; text-decoration: none; font-weight: 500; position: relative; }
  .nav-item svg { stroke: #9ca3af; }
  .nav-item.active { color: var(--wa-dark); font-weight: 700; }
  .nav-item.active svg { stroke: var(--wa-green); }
  .nav-item .notif-badge { position: absolute; top: 6px; right: 22%; background: #DC2626; color: #fff; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center; display: none; }
  .nav-item .notif-badge.show { display: block; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(20px); background: var(--wa-deep); color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: all .3s; z-index: 1000; display: flex; align-items: center; gap: 8px; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast svg { stroke: var(--wa-green); flex-shrink: 0; }
  .toast.error { background: #b91c1c; }
  .toast.error svg { stroke: #fff; }
</style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="loader-logo">Affinity<span> Network</span></div>

  </div>

        <path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>

    </div>
    <div class="menu-item active" onclick="go('notifications.html')">

    <div class="menu-item" onclick="go('support.html')">

      <button class="btn-logout" onclick="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>

          <line x1="21" y1="12" x2="9" y2="12"/>

      </button>

  </nav>

  <main class="content">
    <h1 class="page-title">Notifications</h1>

      <span id="subText">Chargement...</span>

    <div class="push-banner" id="pushBanner" style="display:none;">
      <div class="pb-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <a href="notifications.html" class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      Notifs

  <div class="toast" id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastText">—</span>
  </div>

<script>
  const SUPABASE_URL = 'https://ydwjvvlcnqsftciedpqm.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd2p2dmxjbnFzZnRjaWVkcHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDQyNDAsImV4cCI6MjEwNTY4MDI0MH0.4uQwBGedMBjUZErd8lUM5YfA26gw96RvHdo_J-3PZCY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  let CURRENT_USER = null;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

  (async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.replace('inscription.html'); return; }
    CURRENT_USER = session.user;
    checkPushStatus();
    await loadNotifs();
    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 400);
  })();

  async function loadNotifs() {
    const list = document.getElementById('notifsList');
    const badge = document.getElementById('badgeNL');
    const subText = document.getElementById('subText');
    const navBadge = document.getElementById('navBadge');

    const { data, error } = await sb.rpc('get_mes_notifications');
    if (error || !data) {
      list.innerHTML = emptyBox('Erreur', 'Impossible de charger les notifications');
      return;
    }

    const notifs = data.notifications || [];

    if (data.non_lues > 0) {
      badge.textContent = data.non_lues;
      badge.style.display = 'inline-block';
      navBadge.textContent = data.non_lues;
      navBadge.classList.add('show');
      subText.innerHTML = `<b>${data.non_lues}</b> non lue${data.non_lues > 1 ? 's' : ''}`;
    } else {
      badge.style.display = 'none';
      navBadge.classList.remove('show');
      subText.textContent = notifs.length > 0 ? 'Tout est à jour' : 'Aucune notification';
    }

    if (notifs.length === 0) {
      list.innerHTML = `<div class="empty">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <div class="em-title">Aucune notification</div>
        <div class="em-sub">Reviens plus tard pour voir tes alertes</div>
      </div>`;
      return;
    }

    list.innerHTML = notifs.map((n, i) => `
      <div class="notif-item ${n.lu ? '' : 'unread'}" style="animation-delay:${i * .04}s" onclick="openNotif('${n.id}','${escapeJs(n.lien || '')}')">
        <div class="notif-icon">${n.icone || '🔔'}</div>
        <div class="notif-body">
          <div class="notif-title">${escapeHtml(n.titre)}</div>
          <div class="notif-message">${escapeHtml(n.message)}</div>
          <div class="notif-time">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            ${timeAgo(n.created_at)}
          </div>
        </div>
      </div>
    `).join('');
  }

  async function openNotif(id, lien) {
    await sb.from('notifications').update({ lu: true }).eq('id', id);
    await loadNotifs();
    if (lien && lien !== '' && lien !== 'null' && lien !== 'undefined') {
      window.location.href = lien;
    }
  }

  async function markAllRead() {
    const { error } = await sb.rpc('marquer_notifs_lues');
    if (error) return showToast('Erreur', true);
    showToast('Toutes les notifications sont lues');
    await loadNotifs();
  }

  function checkPushStatus() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      document.getElementById('pushBanner').style.display = 'flex';
    } else {
      document.getElementById('pushBanner').style.display = 'none';
    }
  }

  async function activatePush() {
    if (!('Notification' in window)) return showToast('Navigateur non supporté', true);
    try {
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        document.getElementById('pushBanner').style.display = 'none';
        showToast('✅ Notifications activées !');
        new Notification('Affinity Network', {
          body: 'Tu recevras maintenant tes alertes en temps réel !',
          icon: 'https://ui-avatars.com/api/?name=AN&size=192&background=075E54&color=25D366',
          badge: 'https://ui-avatars.com/api/?name=AN&size=72&background=075E54&color=25D366'
        });
      } else {
        showToast('Notifications refusées', true);
        document.getElementById('pushBanner').style.display = 'none';
      }
    } catch (e) {
      showToast('Impossible d\'activer', true);
    }
  }

  function emptyBox(title, sub) {
    return `<div class="empty">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="12" r="10"/></svg>
      <div class="em-title">${title}</div>
      <div class="em-sub">${sub}</div>
    </div>`;
  }
  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeJs(s) { return String(s ?? '').replace(/['"\\]/g, ''); }
  function timeAgo(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return 'À l\'instant';
    if (diff < 3600) return `Il y a ${Math.floor(diff/60)} min`;
    if (diff < 86400) return `Il y a ${Math.floor(diff/3600)} h`;
    if (diff < 604800) return `Il y a ${Math.floor(diff/86400)} j`;
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
  function toggleMenu() { document.getElementById('menu').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
  function go(page) { window.location.href = page; }
  async function logout() {
    if (!confirm('Veux-tu vraiment te déconnecter ?')) return;
    await sb.auth.signOut();
    window.location.replace('inscription.html');
  }
</script>
</body>
</html>
