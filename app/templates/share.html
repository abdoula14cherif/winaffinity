<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WIN AFFINITY — Partager mes gains</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="manifest" href="/assets/manifest.json"/>
<link rel="icon" type="image/png" href="/assets/app-icon-192.png"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--or:#FF6B35;--bl:#1A3A5C;--bg:#F0F4F8;--wh:#FFFFFF;--tx:#1A2B3C;--txd:#6B7A8D;--bd:#D1DCE8;--ok:#00B894;--t:.3s;--sh:0 4px 20px rgba(26,58,92,.08)}
html,body{min-height:100%;font-family:"Poppins",sans-serif;background:var(--bg);color:var(--tx)}
.header{position:fixed;top:0;left:0;right:0;z-index:20;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bl)}
.brow{display:flex;align-items:center;gap:8px}
.bico{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#FF6B35,#FF8C5A);display:flex;align-items:center;justify-content:center;font-size:16px}
.bname{font-size:18px;font-weight:800;color:#fff}.bname span{color:#FF6B35}
.back-btn{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid rgba(255,255,255,.2);border-radius:8px}
.page{min-height:100vh;padding:76px 16px 50px;max-width:600px;margin:0 auto}
.hero{text-align:center;margin-bottom:24px}
.hero h1{font-size:22px;font-weight:800;color:var(--bl);margin-bottom:6px}
.hero h1 span{color:var(--or)}
.hero p{font-size:13px;color:var(--txd)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.theme-btn{padding:10px;border-radius:12px;border:2px solid var(--bd);cursor:pointer;text-align:center;font-size:12px;font-weight:700;transition:all var(--t)}
.theme-btn.sel{border-color:var(--or);transform:scale(1.03)}
.t1{background:linear-gradient(135deg,#1A3A5C,#0d1f33);color:#FF6B35}
.t2{background:linear-gradient(135deg,#0d1f33,#1a0533);color:#FFD700}
.t3{background:linear-gradient(135deg,#0d330d,#1a3a1a);color:#00B894}
.canvas-wrap{background:var(--wh);border-radius:16px;padding:16px;box-shadow:var(--sh);border:1.5px solid var(--bd);margin-bottom:20px;text-align:center}
canvas{max-width:100%;border-radius:12px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:12px;font-family:"Poppins",sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;text-decoration:none;transition:all var(--t)}
.btn-dl{background:linear-gradient(135deg,#FF6B35,#FF8C5A);color:#fff;box-shadow:0 4px 16px rgba(255,107,53,.4)}
.btn-wa{background:linear-gradient(135deg,#25d366,#20c05a);color:#fff}
.btn-fb{background:linear-gradient(135deg,#1877f2,#0d63d0);color:#fff}
</style>
</head>
<body>
<header class="header">
  <div class="brow"><div class="bico">◈</div><div class="bname">WIN <span>AFFINITY</span></div></div>
  <a href="/dashboard" class="back-btn">← Dashboard</a>
</header>
<div class="page">
  <div class="hero">
    <h1>Partager mes <span>gains</span></h1>
    <p>Génère une image professionnelle de tes performances</p>
  </div>

  <div class="themes">
    <div class="theme-btn t1 sel" onclick="setTheme(0,this)">🌑 Dark Blue</div>
    <div class="theme-btn t2" onclick="setTheme(1,this)">👑 Gold VIP</div>
    <div class="theme-btn t3" onclick="setTheme(2,this)">💚 Green Pro</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="shareCanvas" width="1080" height="1920"></canvas>
  </div>

  <div class="btns">
    <button class="btn btn-dl" onclick="downloadImage()">⬇ Télécharger</button>
    <a class="btn btn-wa" id="btnShareWA" href="#" target="_blank">📱 WhatsApp</a>
    <a class="btn btn-fb" id="btnShareFB" href="#" target="_blank">📘 Facebook</a>
  </div>
</div>

<script>
var userData = {
  name: "{{ user.full_name }}",
  level: "{{ user.level or 'standard' }}",
  balance: {{ wallet.balance or 0 }},
  total_earned: {{ wallet.total_earned or 0 }},
  referrals: {{ referrals_count or 0 }},
  code: "{{ user.referral_code }}"
};

var themes = [
  {
    bg1: "#0d1f33", bg2: "#1A3A5C", bg3: "#0d1220",
    accent: "#FF6B35", accent2: "#FF8C5A",
    star: "#FF6B35", text: "#FFFFFF", sub: "rgba(255,255,255,0.6)",
    card: "rgba(255,107,53,0.08)", cardBorder: "rgba(255,107,53,0.3)",
    name: "DARK BLUE"
  },
  {
    bg1: "#1a0a00", bg2: "#2d1500", bg3: "#0d0800",
    accent: "#FFD700", accent2: "#FFA500",
    star: "#FFD700", text: "#FFFFFF", sub: "rgba(255,255,255,0.6)",
    card: "rgba(255,215,0,0.08)", cardBorder: "rgba(255,215,0,0.3)",
    name: "GOLD VIP"
  },
  {
    bg1: "#001a00", bg2: "#0d2d0d", bg3: "#000d00",
    accent: "#00B894", accent2: "#00d4a8",
    star: "#00B894", text: "#FFFFFF", sub: "rgba(255,255,255,0.6)",
    card: "rgba(0,184,148,0.08)", cardBorder: "rgba(0,184,148,0.3)",
    name: "GREEN PRO"
  }
];

var currentTheme = 0;

function setTheme(idx, el){
  currentTheme = idx;
  document.querySelectorAll(".theme-btn").forEach(b=>b.classList.remove("sel"));
  el.classList.add("sel");
  drawCard();
}

function drawCard(){
  var canvas = document.getElementById("shareCanvas");
  var ctx = canvas.getContext("2d");
  var W = 1080, H = 1920;
  var t = themes[currentTheme];

  // Background cinématographique
  var grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, t.bg1);
  grad.addColorStop(0.5, t.bg2);
  grad.addColorStop(1, t.bg3);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Particules/étoiles en arrière plan
  ctx.fillStyle = "rgba(255,255,255,0.03)";
  for(var i=0; i<80; i++){
    var x = Math.random()*W;
    var y = Math.random()*H;
    var r = Math.random()*3+1;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  // Cercles décoratifs
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = t.accent;
  ctx.beginPath();
  ctx.arc(W*0.85, H*0.12, 300, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(W*0.1, H*0.85, 250, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Lignes diagonales décoratives
  ctx.save();
  ctx.globalAlpha = 0.04;
  ctx.strokeStyle = t.accent;
  ctx.lineWidth = 60;
  for(var l=0; l<5; l++){
    ctx.beginPath();
    ctx.moveTo(-200 + l*300, 0);
    ctx.lineTo(W + (-200 + l*300), H);
    ctx.stroke();
  }
  ctx.restore();

  // Header logo
  drawRoundRect(ctx, W/2-120, 80, 240, 80, 20, t.accent, null, 0.15);
  ctx.fillStyle = t.accent;
  ctx.font = "bold 36px Poppins, Arial";
  ctx.textAlign = "center";
  ctx.fillText("◈ WIN AFFINITY", W/2, 130);

  // Ligne séparatrice
  var lineGrad = ctx.createLinearGradient(100, 0, W-100, 0);
  lineGrad.addColorStop(0, "transparent");
  lineGrad.addColorStop(0.5, t.accent);
  lineGrad.addColorStop(1, "transparent");
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(100, 185);
  ctx.lineTo(W-100, 185);
  ctx.stroke();

  // Titre principal
  ctx.fillStyle = t.text;
  ctx.font = "900 72px Poppins, Arial";
  ctx.textAlign = "center";
  ctx.fillText("MES GAINS", W/2, 310);

  // Sous-titre avec nom
  ctx.fillStyle = t.accent;
  ctx.font = "bold 44px Poppins, Arial";
  var displayName = userData.name.split(" ")[0].toUpperCase();
  ctx.fillText(displayName, W/2, 385);

  // Badge niveau
  var levelText = userData.level === "premium" ? "🥇 PREMIUM" : userData.level === "starter" ? "🥉 STARTER" : "🥈 STANDARD";
  drawRoundRect(ctx, W/2-140, 420, 280, 70, 35, t.accent, null, 0.2);
  ctx.fillStyle = t.accent;
  ctx.font = "bold 30px Poppins, Arial";
  ctx.fillText(levelText, W/2, 463);

  // Carte solde principal
  drawGlowCard(ctx, 80, 530, W-160, 280, t);
  ctx.fillStyle = t.sub;
  ctx.font = "600 34px Poppins, Arial";
  ctx.textAlign = "center";
  ctx.fillText("SOLDE DISPONIBLE", W/2, 600);
  ctx.fillStyle = t.text;
  ctx.font = "900 130px Poppins, Arial";
  ctx.fillText(formatNum(userData.balance), W/2, 730);
  ctx.fillStyle = t.accent;
  ctx.font = "bold 44px Poppins, Arial";
  ctx.fillText("FCFA", W/2, 790);

  // Stats grid - 2x2
  var cards = [
    {label: "TOTAL GAGNÉ", value: formatNum(userData.total_earned)+" F", icon: "💰"},
    {label: "FILLEULS ACTIFS", value: userData.referrals, icon: "👥"},
    {label: "MON NIVEAU", value: userData.level.toUpperCase(), icon: "⭐"},
    {label: "PLATEFORME", value: "WIN AFFINITY", icon: "🏆"},
  ];

  var gx = [80, W/2+20];
  var gy = [860, 1100];
  var gw = W/2 - 100;
  var gh = 200;

  for(var i=0; i<4; i++){
    var cx = gx[i%2];
    var cy = gy[Math.floor(i/2)];
    drawGlowCard(ctx, cx, cy, gw, gh, t);
    ctx.fillStyle = t.accent;
    ctx.font = "40px Arial";
    ctx.textAlign = "center";
    ctx.fillText(cards[i].icon, cx + gw/2, cy + 60);
    ctx.fillStyle = t.text;
    ctx.font = "bold 36px Poppins, Arial";
    ctx.fillText(cards[i].value, cx + gw/2, cy + 110);
    ctx.fillStyle = t.sub;
    ctx.font = "500 22px Poppins, Arial";
    ctx.fillText(cards[i].label, cx + gw/2, cy + 148);
  }

  // Motivation text
  ctx.fillStyle = t.text;
  ctx.font = "italic 600 36px Poppins, Arial";
  ctx.textAlign = "center";
  ctx.fillText(""Rejoins-moi et commence à gagner !"", W/2, 1380);

  // QR code zone / lien
  drawGlowCard(ctx, 80, 1420, W-160, 280, t);
  ctx.fillStyle = t.sub;
  ctx.font = "500 28px Poppins, Arial";
  ctx.textAlign = "center";
  ctx.fillText("Utilise mon code pour t inscrire", W/2, 1475);
  ctx.fillStyle = t.accent;
  ctx.font = "900 56px Poppins, Arial";
  ctx.fillText(userData.code, W/2, 1560);
  ctx.fillStyle = t.sub;
  ctx.font = "500 26px Poppins, Arial";
  ctx.fillText("winaffinity.vercel.app", W/2, 1615);

  // Footer
  var footGrad = ctx.createLinearGradient(0, H-180, 0, H);
  footGrad.addColorStop(0, "transparent");
  footGrad.addColorStop(1, "rgba(0,0,0,0.6)");
  ctx.fillStyle = footGrad;
  ctx.fillRect(0, H-180, W, 180);

  ctx.fillStyle = t.sub;
  ctx.font = "500 26px Poppins, Arial";
  ctx.textAlign = "center";
  ctx.fillText("Plateforme d affiliation • Tâches • Roue de la chance", W/2, H-100);
  ctx.fillStyle = t.accent;
  ctx.font = "bold 28px Poppins, Arial";
  ctx.fillText("winaffinity.vercel.app", W/2, H-55);

  // Update share links
  var shareText = encodeURIComponent("Je gagne "+userData.balance+" FCFA avec WIN AFFINITY ! Rejoins-moi avec le code "+userData.code+" et commence a gagner : https://winaffinity.vercel.app/auth/register?ref="+userData.code);
  document.getElementById("btnShareWA").href = "https://api.whatsapp.com/send?text="+shareText;
  document.getElementById("btnShareFB").href = "https://www.facebook.com/sharer.php?u="+encodeURIComponent("https://winaffinity.vercel.app/auth/register?ref="+userData.code)+"&quote="+shareText;
}

function drawRoundRect(ctx, x, y, w, h, r, color, stroke, alpha){
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  if(color) ctx.fillStyle = color;
  ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
  ctx.restore();
}

function drawGlowCard(ctx, x, y, w, h, t){
  // Glow
  ctx.save();
  ctx.shadowColor = t.accent;
  ctx.shadowBlur = 20;
  ctx.globalAlpha = 0.15;
  drawRoundRect(ctx, x, y, w, h, 20, t.accent, null, 1);
  ctx.restore();
  // Card bg
  drawRoundRect(ctx, x, y, w, h, 20, t.card, null, 1);
  // Border
  ctx.save();
  ctx.strokeStyle = t.cardBorder;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x+20,y);
  ctx.lineTo(x+w-20,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+20);
  ctx.lineTo(x+w,y+h-20);
  ctx.quadraticCurveTo(x+w,y+h,x+w-20,y+h);
  ctx.lineTo(x+20,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-20);
  ctx.lineTo(x,y+20);
  ctx.quadraticCurveTo(x,y,x+20,y);
  ctx.stroke();
  ctx.restore();
}

function formatNum(n){
  return Number(n).toLocaleString("fr-FR");
}

function downloadImage(){
  var canvas = document.getElementById("shareCanvas");
  try {
    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.download = "winaffinity-gains-"+userData.code+".png";
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }, "image/png");
  } catch(e) {
    // Fallback - ouvrir dans nouvel onglet
    var dataUrl = canvas.toDataURL("image/png");
    var win = window.open();
    win.document.write("<img src='"+dataUrl+"' style='max-width:100%'/><br><a download='winaffinity-gains.png' href='"+dataUrl+"'>Appuyer longtemps sur l image pour enregistrer</a>");
  }
}

// Lancer le dessin
drawCard();
</script>
</body></html>
