<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WIN AFFINITY — Partager mes gains</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="manifest" href="/assets/manifest.json"/>
<link rel="icon" type="image/png" href="/assets/app-icon-192.png"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--or:#FF6B35;--bl:#1A3A5C;--bg:#F0F4F8;--wh:#FFFFFF;--tx:#1A2B3C;--txd:#6B7A8D;--bd:#D1DCE8;--ok:#00B894;--t:.3s;--sh:0 4px 20px rgba(26,58,92,.08)}
html,body{min-height:100%;font-family:"Poppins",sans-serif;background:var(--bg);color:var(--tx)}
.header{position:fixed;top:0;left:0;right:0;z-index:20;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bl)}
.brow{display:flex;align-items:center;gap:8px}
.bico{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#FF6B35,#FF8C5A);display:flex;align-items:center;justify-content:center;font-size:16px}
.bname{font-size:18px;font-weight:800;color:#fff}.bname span{color:#FF6B35}
.back-btn{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid rgba(255,255,255,.2);border-radius:8px}
.page{min-height:100vh;padding:76px 16px 50px;max-width:600px;margin:0 auto}
.hero{text-align:center;margin-bottom:24px}
.hero h1{font-size:22px;font-weight:800;color:var(--bl);margin-bottom:6px}
.hero h1 span{color:var(--or)}
.hero p{font-size:13px;color:var(--txd)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.theme-btn{padding:10px;border-radius:12px;border:2px solid var(--bd);cursor:pointer;text-align:center;font-size:12px;font-weight:700;transition:all var(--t)}
.theme-btn.sel{border-color:var(--or);transform:scale(1.03)}
.t1{background:linear-gradient(135deg,#1A3A5C,#0d1f33);color:#FF6B35}
.t2{background:linear-gradient(135deg,#0d1f33,#1a0533);color:#FFD700}
.t3{background:linear-gradient(135deg,#0d330d,#1a3a1a);color:#00B894}
.canvas-wrap{background:var(--wh);border-radius:16px;padding:16px;box-shadow:var(--sh);border:1.5px solid var(--bd);margin-bottom:20px;text-align:center}
canvas{max-width:100%;border-radius:12px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:12px;font-family:"Poppins",sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;text-decoration:none;transition:all var(--t)}
.btn-dl{background:linear-gradient(135deg,#FF6B35,#FF8C5A);color:#fff;box-shadow:0 4px 16px rgba(255,107,53,.4)}
.btn-wa{background:linear-gradient(135deg,#25d366,#20c05a);color:#fff}
.btn-fb{background:linear-gradient(135deg,#1877f2,#0d63d0);color:#fff}
</style>
</head>
<body>
<header class="header">
  <div class="brow"><div class="bico">◈</div><div class="bname">WIN <span>AFFINITY</span></div></div>
  <a href="/dashboard" class="back-btn">← Dashboard</a>
</header>
<div class="page">
  <div class="hero">
    <h1>Partager mes <span>gains</span></h1>
    <p>Génère une image professionnelle de tes performances</p>
  </div>

  <div class="themes">
    <div class="theme-btn t1 sel" onclick="setTheme(0,this)">🌑 Dark Blue</div>
    <div class="theme-btn t2" onclick="setTheme(1,this)">👑 Gold VIP</div>
    <div class="theme-btn t3" onclick="setTheme(2,this)">💚 Green Pro</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="shareCanvas" width="540" height="960"></canvas>
  </div>

  <div class="btns">
    <button class="btn btn-dl" onclick="downloadImage()">⬇ Télécharger</button>
    <a class="btn btn-wa" id="btnShareWA" href="#" target="_blank">📱 WhatsApp</a>
    <a class="btn btn-fb" id="btnShareFB" href="#" target="_blank">📘 Facebook</a>
  </div>
</div>

<script>
var userData = {
  name: "{{ user.full_name }}",
  level: "{{ user.level or 'standard' }}",
  balance: {{ wallet.balance or 0 }},
  total_earned: {{ wallet.total_earned or 0 }},
  referrals: {{ referrals_count or 0 }},
  code: "{{ user.referral_code }}"
};

var themes = [
  {bg1:"#0d1f33",bg2:"#1A3A5C",accent:"#FF6B35",accent2:"#FF8C5A"},
  {bg1:"#1a0a00",bg2:"#2d1500",accent:"#FFD700",accent2:"#FFA500"},
  {bg1:"#001a00",bg2:"#0d2d0d",accent:"#00B894",accent2:"#00d4a8"}
];
var currentTheme = 0;

function setTheme(idx, el){
  currentTheme = idx;
  document.querySelectorAll(".theme-btn").forEach(function(b){b.classList.remove("sel");});
  el.classList.add("sel");
  drawCard();
}

function rr(ctx, x, y, w, h, r, fill){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function drawCard(){
  var canvas = document.getElementById("shareCanvas");
  var ctx = canvas.getContext("2d");
  var W = 540, H = 960;
  var t = themes[currentTheme];

  // Background
  var g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,t.bg1);g.addColorStop(0.5,t.bg2);g.addColorStop(1,t.bg1);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Grille de points déco
  ctx.fillStyle="rgba(255,255,255,0.025)";
  for(var xi=0;xi<W;xi+=30){for(var yi=0;yi<H;yi+=30){ctx.beginPath();ctx.arc(xi,yi,1.5,0,Math.PI*2);ctx.fill();}}

  // Cercle glow haut droite
  var gr=ctx.createRadialGradient(W,0,0,W,0,350);
  gr.addColorStop(0,"rgba(255,107,53,0.12)");gr.addColorStop(1,"transparent");
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);

  // Cercle glow bas gauche
  var gl=ctx.createRadialGradient(0,H,0,0,H,250);
  gl.addColorStop(0,"rgba(255,107,53,0.08)");gl.addColorStop(1,"transparent");
  ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);

  // Bande accent haut
  var bt=ctx.createLinearGradient(0,0,W,0);
  bt.addColorStop(0,"transparent");bt.addColorStop(0.5,t.accent);bt.addColorStop(1,"transparent");
  ctx.fillStyle=bt;ctx.fillRect(0,0,W,4);

  // Logo
  rr(ctx,W/2-130,20,260,55,28,"rgba(255,255,255,0.05)");
  ctx.fillStyle=t.accent;ctx.font="bold 22px Arial";ctx.textAlign="center";
  ctx.fillText("◈  WIN AFFINITY",W/2,54);

  // Séparateur
  var sep=ctx.createLinearGradient(0,0,W,0);
  sep.addColorStop(0,"transparent");sep.addColorStop(0.5,t.accent);sep.addColorStop(1,"transparent");
  ctx.strokeStyle=sep;ctx.globalAlpha=0.5;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(40,88);ctx.lineTo(W-40,88);ctx.stroke();
  ctx.globalAlpha=1;

  // Titre
  ctx.fillStyle="#FFFFFF";ctx.font="900 56px Arial";ctx.textAlign="center";
  ctx.shadowColor=t.accent;ctx.shadowBlur=20;
  ctx.fillText("MES GAINS",W/2,170);ctx.shadowBlur=0;

  // Nom
  ctx.fillStyle=t.accent;ctx.font="bold 28px Arial";
  ctx.fillText(userData.name.split(" ")[0].toUpperCase(),W/2,210);

  // Badge niveau
  var lvl=userData.level==="premium"?"🥇 PREMIUM":userData.level==="starter"?"🥉 STARTER":"🥈 STANDARD";
  rr(ctx,W/2-90,222,180,38,19,"rgba(255,107,53,0.15)");
  ctx.strokeStyle=t.accent;ctx.globalAlpha=0.6;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(W/2-70,222);ctx.lineTo(W/2+70,222);
  ctx.quadraticCurveTo(W/2+90,222,W/2+90,240);
  ctx.lineTo(W/2+90,242);ctx.quadraticCurveTo(W/2+90,260,W/2+70,260);
  ctx.lineTo(W/2-70,260);ctx.quadraticCurveTo(W/2-90,260,W/2-90,242);
  ctx.lineTo(W/2-90,240);ctx.quadraticCurveTo(W/2-90,222,W/2-70,222);
  ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=t.accent;ctx.font="bold 17px Arial";
  ctx.fillText(lvl,W/2,246);

  // Carte solde
  ctx.save();
  ctx.shadowColor=t.accent;ctx.shadowBlur=25;
  rr(ctx,25,278,W-50,168,18,"rgba(255,255,255,0.05)");
  ctx.restore();
  ctx.strokeStyle=t.accent;ctx.globalAlpha=0.35;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.rect(25,278,W-50,168);ctx.stroke();ctx.globalAlpha=1;

  ctx.fillStyle="rgba(255,255,255,0.4)";ctx.font="600 14px Arial";
  ctx.fillText("SOLDE DISPONIBLE",W/2,308);
  ctx.fillStyle="#FFFFFF";ctx.font="900 76px Arial";
  ctx.shadowColor=t.accent;ctx.shadowBlur=15;
  ctx.fillText(Number(userData.balance).toLocaleString("fr-FR"),W/2,398);
  ctx.shadowBlur=0;
  ctx.fillStyle=t.accent;ctx.font="bold 26px Arial";
  ctx.fillText("FCFA",W/2,432);

  // Stats 2x2
  var stats=[
    ["💰","TOTAL GAGNÉ",Number(userData.total_earned).toLocaleString("fr-FR")+" F"],
    ["👥","FILLEULS",userData.referrals+" actifs"],
    ["⭐","NIVEAU",(userData.level||"standard").toUpperCase()],
    ["🔗","MON CODE",userData.code]
  ];
  var sx=[25,W/2+8],sy=[468,572],sw=W/2-33,sh=88;
  for(var i=0;i<4;i++){
    var cx=sx[i%2],cy=sy[Math.floor(i/2)];
    rr(ctx,cx,cy,sw,sh,12,"rgba(255,255,255,0.04)");
    ctx.strokeStyle=t.accent;ctx.globalAlpha=0.18;ctx.lineWidth=1;
    ctx.beginPath();ctx.rect(cx,cy,sw,sh);ctx.stroke();ctx.globalAlpha=1;
    ctx.font="22px Arial";ctx.fillStyle="#FFFFFF";
    ctx.fillText(stats[i][0],cx+sw/2,cy+28);
    ctx.fillStyle=t.accent;ctx.font="bold 18px Arial";
    ctx.fillText(stats[i][2],cx+sw/2,cy+54);
    ctx.fillStyle="rgba(255,255,255,0.35)";ctx.font="10px Arial";
    ctx.fillText(stats[i][1],cx+sw/2,cy+72);
  }

  // Citation
  ctx.fillStyle="rgba(255,255,255,0.45)";ctx.font="italic 15px Arial";
  ctx.fillText('"Rejoins-moi et commence a gagner !"',W/2,692);

  // Carte code
  ctx.save();
  ctx.shadowColor=t.accent;ctx.shadowBlur=18;
  rr(ctx,25,710,W-50,148,18,"rgba(255,255,255,0.04)");
  ctx.restore();
  ctx.strokeStyle=t.accent;ctx.globalAlpha=0.45;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.rect(25,710,W-50,148);ctx.stroke();ctx.globalAlpha=1;

  ctx.fillStyle="rgba(255,255,255,0.35)";ctx.font="12px Arial";
  ctx.fillText("INSCRIS-TOI AVEC MON CODE",W/2,736);
  ctx.fillStyle=t.accent;ctx.font="900 52px Arial";
  ctx.shadowColor=t.accent;ctx.shadowBlur=12;
  ctx.fillText(userData.code,W/2,800);ctx.shadowBlur=0;
  ctx.fillStyle="rgba(255,255,255,0.25)";ctx.font="12px Arial";
  ctx.fillText("winaffinity.vercel.app",W/2,832);

  // Bande accent bas
  ctx.fillStyle=bt;ctx.fillRect(0,H-4,W,4);
  ctx.fillStyle="rgba(255,255,255,0.12)";ctx.font="11px Arial";
  ctx.fillText("Plateforme d affiliation • Gains quotidiens",W/2,924);

  // Liens partage
  var txt=encodeURIComponent("Je gagne "+userData.balance+" FCFA avec WIN AFFINITY ! Code: "+userData.code+" - https://winaffinity.vercel.app/auth/register?ref="+userData.code);
  document.getElementById("btnShareWA").href="https://api.whatsapp.com/send?text="+txt;
  document.getElementById("btnShareFB").href="https://www.facebook.com/sharer.php?u="+encodeURIComponent("https://winaffinity.vercel.app/auth/register?ref="+userData.code);
}

function downloadImage(){
  var canvas = document.getElementById("shareCanvas");
  var dataUrl = canvas.toDataURL("image/png");
  var win = window.open("","_blank");
  win.document.write("<!DOCTYPE html><html><head><meta name=viewport content=width=device-width><title>Mes Gains WIN AFFINITY</title></head><body style=margin:0;background:#0d1f33;text-align:center><p style=color:#FF6B35;font-family:Arial;padding:14px;font-size:14px>📸 Appuyez longtemps sur l image puis Enregistrer</p><img src='"+dataUrl+"' style=width:100%;max-width:540px></body></html>");
  win.document.close();
}

window.addEventListener("load", function(){ drawCard(); });
</script>
</body></html>
