<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WIN AFFINITY — Page introuvable</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--or:#FF6B35;--bl:#1A3A5C;--bg:#F0F4F8;--wh:#FFFFFF;--tx:#1A2B3C;--txd:#6B7A8D}
html,body{min-height:100%;font-family:"Poppins",sans-serif;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center}
.container{text-align:center;padding:40px 20px;max-width:500px}
.code{font-size:100px;font-weight:800;background:linear-gradient(135deg,#FF6B35,#1A3A5C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.title{font-size:24px;font-weight:800;color:var(--bl);margin:16px 0 8px}
.desc{font-size:14px;color:var(--txd);margin-bottom:28px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:linear-gradient(135deg,#FF6B35,#FF8C5A);color:#fff;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 4px 16px rgba(255,107,53,.4)}
.ico{font-size:60px;margin-bottom:16px}
</style>
</head>
<body>
<div class="container">
  <div class="ico">🔍</div>
  <div class="code">404</div>
  <div class="title">Page introuvable</div>
  <div class="desc">La page que vous cherchez n existe pas ou a été déplacée.</div>
  <a href="/dashboard" class="btn">🏠 Retour au Dashboard</a>
</div>
</body></html>
