<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WIN AFFINITY — Inscription</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Variables ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:        #C9A84C;
      --gold-light:  #E8C96A;
      --gold-dim:    rgba(201,168,76,0.15);
      --navy:        #07101F;
      --navy-mid:    #0D1B2A;
      --navy-card:   rgba(13,27,42,0.75);
      --white:       #F4EFE6;
      --white-dim:   rgba(244,239,230,0.6);
      --white-soft:  rgba(244,239,230,0.08);
      --danger:      #E05A5A;
      --success:     #4CAF7E;
      --border:      rgba(201,168,76,0.25);
      --radius:      18px;
      --transition:  0.35s cubic-bezier(.4,0,.2,1);
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Arrière-plan animé ─────────────────────────────── */
    .bg-scene {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 10%, #0e2240 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 80%, #1a0e05 0%, transparent 60%),
                  linear-gradient(160deg, #07101F 0%, #0a1628 50%, #060c14 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-1 { width:500px; height:500px; background:rgba(201,168,76,.07); top:-100px; left:-150px; animation-delay:0s; }
    .orb-2 { width:350px; height:350px; background:rgba(30,80,140,.12);  bottom:-50px; right:-80px;  animation-delay:-4s; }
    .orb-3 { width:200px; height:200px; background:rgba(201,168,76,.05); top:40%;  left:50%;         animation-delay:-8s; }

    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,30px) scale(1.08); }
    }

    /* Canvas particules */
    #particles { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.45; }

    /* ── Layout ─────────────────────────────────────────── */
    .page-wrapper {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--navy-card);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 44px 44px;
      box-shadow:
        0 0 0 1px rgba(201,168,76,.06) inset,
        0 40px 80px rgba(0,0,0,.55),
        0 0 60px rgba(201,168,76,.04);
      animation: cardIn .7s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes cardIn {
      from { opacity:0; transform: translateY(32px) scale(.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    /* ── En-tête ─────────────────────────────────────────── */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--gold), #8B5A00);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 20px rgba(201,168,76,.35);
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .12em;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-tagline {
      font-size: 13px;
      color: var(--white-dim);
      letter-spacing: .06em;
    }

    /* ── Titre section ───────────────────────────────────── */
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--white);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: .02em;
    }
    .section-subtitle {
      font-size: 13.5px;
      color: var(--white-dim);
      text-align: center;
      margin-bottom: 28px;
    }

    /* ── Alerte erreur / succès ──────────────────────────── */
    .alert {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13.5px;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
      animation: alertIn .3s ease both;
    }
    .alert-error   { background: rgba(224,90,90,.12);  border:1px solid rgba(224,90,90,.3);  color:#F08080; }
    .alert-success { background: rgba(76,175,126,.12); border:1px solid rgba(76,175,126,.3); color:#7ECBA3; }
    @keyframes alertIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }

    /* ── Formulaire ──────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap .ico {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--gold); opacity: .5; font-size: 15px; pointer-events: none;
      transition: opacity var(--transition);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      background: var(--white-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px 13px 40px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      color: var(--white);
      outline: none;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
      -webkit-appearance: none;
    }
    input::placeholder { color: rgba(244,239,230,.25); }
    input:focus {
      border-color: var(--gold);
      background: rgba(201,168,76,.06);
      box-shadow: 0 0 0 3px rgba(201,168,76,.12);
    }
    input:focus + .ico, input:focus ~ .ico { opacity: 1; }

    /* Indicateur de force du mot de passe */
    .pw-strength {
      display: flex; gap: 5px; margin-top: 5px;
    }
    .pw-bar {
      flex: 1; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,.08);
      transition: background .3s;
    }
    .pw-bar.active-1 { background: var(--danger); }
    .pw-bar.active-2 { background: #E09050; }
    .pw-bar.active-3 { background: var(--gold); }
    .pw-bar.active-4 { background: var(--success); }

    .pw-label { font-size: 11px; color: var(--white-dim); margin-top: 3px; }

    /* Afficher/masquer le mot de passe */
    .eye-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--white-dim); font-size: 16px;
      padding: 4px; transition: color var(--transition);
    }
    .eye-toggle:hover { color: var(--gold); }

    /* ── Bouton principal ────────────────────────────────── */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      background: linear-gradient(135deg, var(--gold) 0%, #A07020 100%);
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .06em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
      box-shadow: 0 4px 24px rgba(201,168,76,.35);
      text-transform: uppercase;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(201,168,76,.5);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* Spinner */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(7,16,31,.3);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Pied du formulaire ──────────────────────────────── */
    .form-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
      color: var(--white-dim);
    }
    .form-footer a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition);
    }
    .form-footer a:hover { color: var(--gold-light); }

    /* Séparateur */
    .sep {
      display: flex; align-items: center; gap: 12px;
      margin: 10px 0 0;
      color: rgba(244,239,230,.2);
      font-size: 12px;
    }
    .sep::before, .sep::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    /* ── Bouton de traduction ────────────────────────────── */
    .lang-btn {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      background: var(--navy-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--gold);
      transition: all var(--transition);
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    .lang-btn:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
      transform: translateY(-1px);
    }
    .lang-flag { font-size: 16px; }

    /* ── Lignes de grille dorées ─────────────────────────── */
    .grid-line {
      position: fixed;
      pointer-events: none; z-index: 1;
      background: linear-gradient(to bottom, transparent, rgba(201,168,76,.04), transparent);
    }
    .grid-v { width: 1px; height: 100vh; top: 0; }
    .grid-v:nth-child(1) { left: 25%; }
    .grid-v:nth-child(2) { left: 50%; }
    .grid-v:nth-child(3) { left: 75%; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 580px) {
      .card { padding: 36px 24px 32px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
    }
  </style>
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#C9A84C"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="WIN AFFINITY"/>
  <link rel="apple-touch-icon" href="/static/icon-192.png"/>
</head>
<body>

<!-- Arrière-plan -->
<div class="bg-scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="grid-line grid-v"></div>
<div class="grid-line grid-v"></div>
<div class="grid-line grid-v"></div>
<canvas id="particles"></canvas>

<!-- Bouton langue -->
<button class="lang-btn" onclick="toggleLang()" id="langBtn">
  <span class="lang-flag">🇬🇧</span>
  <span id="langLabel">English</span>
</button>

<!-- Contenu principal -->
<div class="page-wrapper">
  <div class="card">

    <!-- Logo / Brand -->
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">◈</div>
        <span class="brand-name">WIN AFFINITY</span>
      </div>
      <p class="brand-tagline" data-fr="Construisez votre réseau, multipliez vos gains" data-en="Build your network, multiply your earnings">
        Construisez votre réseau, multipliez vos gains
      </p>
    </div>

    <!-- Titre -->
    <h1 class="section-title" data-fr="Créer un compte" data-en="Create Account">Créer un compte</h1>
    <p class="section-subtitle" data-fr="Rejoignez la communauté WIN AFFINITY" data-en="Join the WIN AFFINITY community">
      Rejoignez la communauté WIN AFFINITY
    </p>

    <!-- Alerte erreur (Python injecte {{ error }}) -->
    {% if error %}
    <div class="alert alert-error">
      <span>⚠</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Formulaire -->
    <form method="POST" action="/auth/register" id="registerForm" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

      <div class="form-grid">

        <!-- Nom complet -->
        <div class="form-group full">
          <label data-fr="NOM COMPLET" data-en="FULL NAME">NOM COMPLET</label>
          <div class="input-wrap">
            <input type="text" name="full_name" id="full_name"
                   placeholder="Jean Dupont"
                   autocomplete="name" required />
            <span class="ico">👤</span>
          </div>
        </div>

        <!-- Téléphone -->
        <div class="form-group">
          <label data-fr="TÉLÉPHONE" data-en="PHONE">TÉLÉPHONE</label>
          <div class="input-wrap">
            <input type="tel" name="phone" id="phone"
                   placeholder="+221 77 000 0000"
                   autocomplete="tel" required />
            <span class="ico">📱</span>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label data-fr="ADRESSE E-MAIL" data-en="EMAIL ADDRESS">ADRESSE E-MAIL</label>
          <div class="input-wrap">
            <input type="email" name="email" id="email"
                   placeholder="vous@exemple.com"
                   autocomplete="email" required />
            <span class="ico">✉</span>
          </div>
        </div>

        <!-- Mot de passe -->
        <div class="form-group">
          <label data-fr="MOT DE PASSE" data-en="PASSWORD">MOT DE PASSE</label>
          <div class="input-wrap">
            <input type="password" name="password" id="password"
                   placeholder="••••••••"
                   autocomplete="new-password" required
                   oninput="checkStrength(this.value)" />
            <span class="ico">🔒</span>
            <button type="button" class="eye-toggle" onclick="togglePw('password',this)" tabindex="-1">👁</button>
          </div>
          <div class="pw-strength">
            <div class="pw-bar" id="bar1"></div>
            <div class="pw-bar" id="bar2"></div>
            <div class="pw-bar" id="bar3"></div>
            <div class="pw-bar" id="bar4"></div>
          </div>
          <div class="pw-label" id="pwLabel"></div>
        </div>

        <!-- Confirmer le mot de passe -->
        <div class="form-group">
          <label data-fr="CONFIRMER" data-en="CONFIRM">CONFIRMER</label>
          <div class="input-wrap">
            <input type="password" name="password_confirm" id="password_confirm"
                   placeholder="••••••••"
                   autocomplete="new-password" required />
            <span class="ico">🔒</span>
            <button type="button" class="eye-toggle" onclick="togglePw('password_confirm',this)" tabindex="-1">👁</button>
          </div>
        </div>

        <!-- Code de parrainage -->
        <div class="form-group full">
          <label data-fr="CODE DE PARRAINAGE (OPTIONNEL)" data-en="REFERRAL CODE (OPTIONAL)">CODE DE PARRAINAGE (OPTIONNEL)</label>
          <div class="input-wrap">
            <input type="text" name="referral_code" id="referral_code"
                   placeholder="ex: A3BX7KQ2"
                   value="{{ referral_code }}"
                   maxlength="20"
                   style="text-transform:uppercase" />
            <span class="ico">🎁</span>
          </div>
        </div>

      </div><!-- /.form-grid -->

      <!-- Bouton soumettre -->
      <button type="submit" class="btn-primary" id="submitBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText" data-fr="CRÉER MON COMPTE" data-en="CREATE MY ACCOUNT">CRÉER MON COMPTE</span>
        <span>→</span>
      </button>

    </form>

    <!-- Pied -->
    <div class="sep" data-fr="Déjà membre ?" data-en="Already a member?">Déjà membre ?</div>
    <div class="form-footer">
      <a href="/auth/login" data-fr="Se connecter à mon compte" data-en="Sign in to my account">Se connecter à mon compte</a>
    </div>

  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────
   PARTICULES
───────────────────────────────────────────────────────── */
(function(){
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(let i = 0; i < 55; i++){
    particles.push({
      x: Math.random()*1920, y: Math.random()*1080,
      r: Math.random()*1.4+.3,
      vx: (Math.random()-.5)*.18,
      vy: (Math.random()-.5)*.18,
      o: Math.random()*.5+.1
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(201,168,76,${p.o})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ─────────────────────────────────────────────────────────
   TRADUCTION FR / EN
───────────────────────────────────────────────────────── */
let currentLang = 'fr';

function toggleLang(){
  currentLang = currentLang === 'fr' ? 'en' : 'fr';
  const isEn = currentLang === 'en';

  document.getElementById('langLabel').textContent = isEn ? 'Français' : 'English';
  document.querySelector('.lang-flag').textContent  = isEn ? '🇫🇷' : '🇬🇧';
  document.documentElement.setAttribute('lang', currentLang);

  // Traduit tous les éléments portant data-fr / data-en
  document.querySelectorAll('[data-fr]').forEach(el => {
    el.textContent = isEn ? el.dataset.en : el.dataset.fr;
  });

  // Traduit les placeholders
  const ph = {
    full_name: { fr:'Jean Dupont',          en:'John Smith' },
    phone:     { fr:'+221 77 000 0000',     en:'+1 555 000 0000' },
    email:     { fr:'vous@exemple.com',     en:'you@example.com' },
    referral_code: { fr:'ex: A3BX7KQ2',    en:'e.g.: A3BX7KQ2' },
  };
  Object.entries(ph).forEach(([id,v])=>{
    const el = document.getElementById(id);
    if(el) el.placeholder = isEn ? v.en : v.fr;
  });

  document.querySelector('[data-sep]') && (document.querySelector('[data-sep]').textContent = isEn ? 'Already a member?' : 'Déjà membre ?');
}

/* ─────────────────────────────────────────────────────────
   FORCE DU MOT DE PASSE
───────────────────────────────────────────────────────── */
function checkStrength(pw){
  let score = 0;
  if(pw.length >= 8)  score++;
  if(/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if(/\d/.test(pw))   score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;

  const bars   = ['bar1','bar2','bar3','bar4'];
  const labels = ['','Faible','Moyen','Fort','Très fort'];
  const labelsEn = ['','Weak','Fair','Strong','Very strong'];

  bars.forEach((id,i) => {
    const el = document.getElementById(id);
    el.className = 'pw-bar' + (i < score ? ` active-${score}` : '');
  });
  const lbl = document.getElementById('pwLabel');
  lbl.textContent = pw.length === 0 ? '' : (currentLang==='en' ? labelsEn[score] : labels[score]);
}

/* ─────────────────────────────────────────────────────────
   AFFICHER / MASQUER MOT DE PASSE
───────────────────────────────────────────────────────── */
function togglePw(id, btn){
  const input = document.getElementById(id);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.textContent = isHidden ? '🙈' : '👁';
}

/* ─────────────────────────────────────────────────────────
   SPINNER AU SUBMIT
───────────────────────────────────────────────────────── */
document.getElementById('registerForm').addEventListener('submit', function(e){
  // Validation client légère avant envoi
  const pw  = document.getElementById('password').value;
  const cpw = document.getElementById('password_confirm').value;
  if(pw !== cpw){
    e.preventDefault();
    const msg = currentLang==='en' ? 'Passwords do not match.' : 'Les mots de passe ne correspondent pas.';
    showInlineError(msg);
    return;
  }
  // Affichage spinner
  document.getElementById('spinner').style.display  = 'block';
  document.getElementById('btnText').textContent = currentLang==='en' ? 'CREATING...' : 'CRÉATION...';
  document.getElementById('submitBtn').disabled = true;
});

function showInlineError(msg){
  let alert = document.querySelector('.alert-error');
  if(!alert){
    alert = document.createElement('div');
    alert.className = 'alert alert-error';
    document.querySelector('.section-subtitle').after(alert);
  }
  alert.innerHTML = `<span>⚠</span><span>${msg}</span>`;
  alert.scrollIntoView({ behavior:'smooth', block:'center' });
}

/* ─────────────────────────────────────────────────────────
   CODE DE PARRAINAGE EN MAJUSCULES AUTOMATIQUE
───────────────────────────────────────────────────────── */
document.getElementById('referral_code').addEventListener('input', function(){
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
});
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/static/sw.js')
    .then(()=>console.log('SW registered'))
    .catch(e=>console.log('SW error',e));
}
</script>
</body>
</html>
