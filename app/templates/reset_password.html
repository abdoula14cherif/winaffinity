<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WIN AFFINITY — Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--or:#FF6B35;--orl:#FF8C5A;--bl:#1A3A5C;--bg:#F0F4F8;--wh:#FFFFFF;--tx:#1A2B3C;--txd:#6B7A8D;--bd:#D1DCE8;--ok:#00B894;--er:#E74C3C}
html,body{min-height:100%;font-family:"Poppins",sans-serif;background:linear-gradient(135deg,#1A3A5C,#2D5F8F);color:var(--tx);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--wh);border-radius:20px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.logo{text-align:center;margin-bottom:24px}
.bico{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#FF6B35,#FF8C5A);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 10px}
.bname{font-size:20px;font-weight:800;color:var(--bl)}.bname span{color:var(--or)}
.title{font-size:18px;font-weight:800;color:var(--bl);margin-bottom:6px;text-align:center}
.sub{font-size:13px;color:var(--txd);text-align:center;margin-bottom:20px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
label{font-size:11px;font-weight:600;color:var(--bl);letter-spacing:.05em;text-transform:uppercase}
input{width:100%;background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:12px;font-family:"Poppins",sans-serif;font-size:13px;color:var(--tx);outline:none}
input:focus{border-color:var(--or)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#FF6B35,#FF8C5A);color:#fff;font-family:"Poppins",sans-serif;font-size:14px;font-weight:700;border:none;border-radius:12px;cursor:pointer;margin-bottom:14px}
.alert{border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px}
.ae{background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.2);color:var(--er)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="bico">◈</div>
    <div class="bname">WIN <span>AFFINITY</span></div>
  </div>
  <div class="title">Nouveau mot de passe</div>
  <div class="sub">Choisissez un nouveau mot de passe sécurisé</div>
  {% if error %}<div class="alert ae">⚠ {{ error }}</div>{% endif %}
  <form method="POST" action="/auth/reset-password">
    <input type="hidden" name="token" value="{{ token }}"/>
    <div class="fg"><label>Nouveau mot de passe</label><input type="password" name="new_password" placeholder="Min. 6 caractères" required/></div>
    <div class="fg"><label>Confirmer</label><input type="password" name="confirm_password" placeholder="Répétez le mot de passe" required/></div>
    <button type="submit" class="btn">🔒 Réinitialiser</button>
  </form>
</div>
</body></html>
