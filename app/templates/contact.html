<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WIN AFFINITY — Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C9A84C;--gold-light:#E8C96A;--gold-dim:rgba(201,168,76,.13);--navy:#07101F;--navy-card:rgba(13,27,42,.85);--white:#F4EFE6;--white-dim:rgba(244,239,230,.55);--soft:rgba(244,239,230,.06);--border:rgba(201,168,76,.2);--r:16px;--t:.35s cubic-bezier(.4,0,.2,1)}
    html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white)}
    .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 60% 50% at 0% 0%,#0e2240 0%,transparent 55%),linear-gradient(165deg,#07101F 0%,#091525 100%)}
    .header{position:fixed;top:0;left:0;right:0;z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,16,31,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;letter-spacing:.1em;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .brand-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#8B5A00);display:flex;align-items:center;justify-content:center;font-size:17px}
    .back-btn{display:flex;align-items:center;gap:6px;color:var(--gold);text-decoration:none;font-size:13.5px;font-weight:500;padding:8px 14px;border:1px solid var(--border);border-radius:8px}
    .page{position:relative;z-index:2;min-height:100vh;padding:90px 20px 60px;max-width:600px;margin:0 auto}
    .hero{text-align:center;margin-bottom:36px}
    .hero h1{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;margin-bottom:8px}
    .hero h1 span{color:var(--gold)}
    .hero p{font-size:14px;color:var(--white-dim)}
    .card{background:var(--navy-card);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;backdrop-filter:blur(20px)}
    .form-group{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
    label{font-size:11.5px;font-weight:500;color:var(--gold);letter-spacing:.09em;text-transform:uppercase}
    input,textarea,select{width:100%;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:13px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--white);outline:none;transition:border-color var(--t),box-shadow var(--t);-webkit-appearance:none}
    input::placeholder,textarea::placeholder{color:rgba(244,239,230,.22)}
    input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.13)}
    textarea{resize:vertical;min-height:120px}
    select option{background:#0D1B2A}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),#A07020);color:var(--navy);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:12px;cursor:pointer;transition:transform var(--t),box-shadow var(--t);box-shadow:0 4px 20px rgba(201,168,76,.35)}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(201,168,76,.5)}
    .social-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
    .social-btn{display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid;font-size:13px;font-weight:500;text-decoration:none;transition:all var(--t)}
    .s-wa{background:rgba(37,211,102,.08);border-color:rgba(37,211,102,.3);color:#25d366}
    .s-tg{background:rgba(0,136,204,.08);border-color:rgba(0,136,204,.3);color:#08c}
    .s-em{background:var(--gold-dim);border-color:var(--border);color:var(--gold)}
    .social-btn:hover{transform:translateY(-1px)}
    .success-msg{background:rgba(76,175,126,.12);border:1px solid rgba(76,175,126,.3);color:#7ECBA3;border-radius:10px;padding:14px;text-align:center;margin-bottom:16px;display:none}
  </style>
</head>
<body>
<div class="bg"></div>
<header class="header">
  <div class="brand"><div class="brand-icon">◈</div>WIN AFFINITY</div>
  <a href="/dashboard" class="back-btn">← Dashboard</a>
</header>
<div class="page">
  <div class="hero">
    <h1>Nous <span>contacter</span></h1>
    <p>Une question ? Nous répondons sous 24h</p>
  </div>
  <div class="card">
    <div class="success-msg" id="successMsg">✓ Message envoyé ! Nous vous répondrons bientôt.</div>
    <div class="form-group">
      <label>SUJET</label>
      <select id="sujet">
        <option value="">Choisir un sujet</option>
        <option>Problème de paiement</option>
        <option>Retrait en attente</option>
        <option>Problème de parrainage</option>
        <option>Question sur les tâches</option>
        <option>Autre</option>
      </select>
    </div>
    <div class="form-group">
      <label>VOTRE NOM</label>
      <input type="text" id="nom" value="{{ user.full_name }}" placeholder="Votre nom"/>
    </div>
    <div class="form-group">
      <label>EMAIL</label>
      <input type="email" id="email" value="{{ user.email }}" placeholder="votre@email.com"/>
    </div>
    <div class="form-group">
      <label>MESSAGE</label>
      <textarea id="message" placeholder="Décrivez votre problème en détail..."></textarea>
    </div>
    <button class="btn" onclick="sendMsg()">
      <span>📩</span> ENVOYER LE MESSAGE
    </button>
    <div class="social-row">
      <a href="https://wa.me/221770000000" target="_blank" class="social-btn s-wa">📱 WhatsApp</a>
      <a href="https://t.me/winaffinity" target="_blank" class="social-btn s-tg">✈️ Telegram</a>
      <a href="mailto:abdoula12cherif@gmail.com" class="social-btn s-em">📧 Email direct</a>
    </div>
  </div>
</div>
<script>
function sendMsg(){
  const sujet = document.getElementById('sujet').value;
  const msg = document.getElementById('message').value;
  if(!sujet || !msg){ alert('Veuillez remplir tous les champs.'); return; }
  const wa = `https://wa.me/221770000000?text=Sujet: ${encodeURIComponent(sujet)}%0ANom: ${encodeURIComponent('{{ user.full_name }}')}%0AEmail: ${encodeURIComponent('{{ user.email }}')}%0AMessage: ${encodeURIComponent(msg)}`;
  window.open(wa, '_blank');
  document.getElementById('successMsg').style.display='block';
}
</script>
</body>
</html>
