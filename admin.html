<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Network — Admin</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#075E54">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="https://i.ibb.co/996nZCn7/file-000000000e4481f49ce58934aa6b6a51.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --wa-green: #25D366; --wa-dark: #128C7E; --wa-deep: #075E54;
    --alibaba: #FF6A00; --gold: #FFB800; --vip: #9333EA;
    --bg: #f7f9f8; --text: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
    --danger: #dc2626; --warn: #f59e0b;
  }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 30px; min-height: 100vh; overflow-x: hidden; -webkit-user-select: none; user-select: none; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }

  .loader { position: fixed; inset: 0; z-index: 9999; background: var(--wa-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .6s ease, visibility .6s ease; }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader-logo { font-size: 24px; font-weight: 700; color: #fff; }
  .loader-logo span { color: var(--wa-green); }
  .spinner { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--wa-green); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .anim { opacity: 0; animation: fadeInUp .4s ease forwards; }

  .header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: linear-gradient(135deg, #1a1a1a, var(--wa-deep)); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); padding-top: max(14px, env(safe-area-inset-top)); }
  .header-logo-wrap { display: flex; align-items: center; gap: 10px; }
  .header-logo-wrap img { width: 36px; height: 36px; border-radius: 10px; background: #fff; padding: 3px; object-fit: contain; }
  .logo { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .logo .badge-admin { background: var(--alibaba); color: #fff; font-size: 9px; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800; }
  .btn-exit { background: rgba(255,255,255,.15); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-exit svg { stroke: #fff; }

  .tabs { background: #fff; padding: 8px 10px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border); position: sticky; top: 64px; z-index: 99; -ms-overflow-style: none; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; background: #f7faf8; color: var(--muted); border: none; cursor: pointer; font-family: inherit; white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: all .2s; position: relative; }
  .tab svg { stroke: currentColor; }
  .tab.active { background: linear-gradient(135deg, var(--wa-dark), var(--wa-green)); color: #fff; box-shadow: 0 3px 10px rgba(18,140,126,.3); }
  .tab .tab-badge { background: var(--danger); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 8px; min-width: 18px; text-align: center; display: none; }
  .tab .tab-badge.show { display: inline-block; }

  .content { padding: 16px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-box { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); border-left: 4px solid var(--wa-green); animation: fadeInUp .4s ease forwards; opacity: 0; }
  .stat-box:nth-child(2) { border-color: var(--alibaba); }
  .stat-box:nth-child(3) { border-color: var(--wa-dark); }
  .stat-box:nth-child(4) { border-color: #3b82f6; }
  .stat-box:nth-child(5) { border-color: var(--warn); }
  .stat-box:nth-child(6) { border-color: var(--danger); }
  .stat-box .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: .3px; margin-bottom: 6px; }
  .stat-box .val { font-size: 20px; font-weight: 800; color: var(--text); }

  .admin-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .admin-toolbar h2 { font-size: 17px; font-weight: 800; color: var(--wa-deep); }
  .btn-add { background: linear-gradient(135deg, var(--wa-dark), var(--wa-green)); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; box-shadow: 0 3px 10px rgba(18,140,126,.3); transition: transform .15s; }
  .btn-add:active { transform: scale(.95); }
  .btn-add svg { stroke: #fff; }

  .item-card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); display: flex; align-items: flex-start; gap: 12px; animation: fadeInUp .35s ease forwards; opacity: 0; }
  .item-card .ic-img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: #f3f4f6; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .item-card .ic-body { flex: 1; min-width: 0; }
  .item-card .ic-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .item-card .ic-meta { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .item-card .ic-meta .dot { color: #d1d5db; }
  .item-card .ic-desc { font-size: 12px; color: #4b5563; line-height: 1.5; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #f3f4f6; }
  .item-card .ic-actions { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .icon-btn { width: 32px; height: 32px; border-radius: 9px; background: #f7faf8; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, transform .15s; }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.edit svg { stroke: var(--wa-dark); }
  .icon-btn.edit:hover { background: rgba(18,140,126,.1); }
  .icon-btn.delete svg { stroke: var(--danger); }
  .icon-btn.delete:hover { background: rgba(220,38,38,.1); }
  .icon-btn.view svg { stroke: var(--alibaba); }
  .icon-btn.view:hover { background: rgba(255,106,0,.1); }
  .icon-btn.check svg { stroke: #166534; }
  .icon-btn.check:hover { background: rgba(37,211,102,.15); }
  .icon-btn.close-x svg { stroke: var(--danger); }
  .icon-btn.close-x:hover { background: rgba(220,38,38,.1); }

  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .3px; }
  .badge.green { background: rgba(37,211,102,.15); color: #166534; }
  .badge.orange { background: rgba(255,106,0,.15); color: var(--alibaba); }
  .badge.red { background: rgba(220,38,38,.15); color: var(--danger); }
  .badge.blue { background: rgba(59,130,246,.15); color: #2563eb; }
  .badge.gray { background: rgba(107,114,128,.15); color: #4b5563; }
  .badge.gold { background: rgba(255,184,0,.15); color: #B45309; }
  .badge.vip { background: linear-gradient(135deg, rgba(147,51,234,.15), rgba(217,70,239,.15)); color: var(--vip); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .empty svg { stroke: #d1d5db; margin-bottom: 10px; }

  .modal-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s; backdrop-filter: blur(3px); }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal { background: #fff; width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; transform: translateY(100%); transition: transform .4s cubic-bezier(.4,0,.2,1); max-height: 92vh; overflow-y: auto; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 42px; height: 5px; border-radius: 5px; background: #d1d5db; margin: 0 auto 16px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--wa-deep); }
  .modal-close { width: 34px; height: 34px; border-radius: 50%; background: #f3f4f6; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .modal-close svg { stroke: var(--muted); }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 700; color: var(--wa-deep); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: #f7faf8; outline: none; transition: border-color .2s, background .2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--wa-green); background: #fff; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-check { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  .form-check input { width: auto; }
  .form-check label { margin: 0; font-size: 13px; font-weight: 600; }

  .btn-primary, .btn-danger, .btn-warn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s; }
  .btn-primary { background: linear-gradient(135deg, var(--wa-dark), var(--wa-green)); color: #fff; box-shadow: 0 4px 14px rgba(18,140,126,.3); }
  .btn-primary:active { transform: scale(.97); }
  .btn-primary svg { stroke: #fff; }
  .btn-danger { background: linear-gradient(135deg, #b91c1c, #dc2626); color: #fff; box-shadow: 0 4px 14px rgba(185,28,28,.3); }
  .btn-danger:active { transform: scale(.97); }
  .btn-danger svg { stroke: #fff; }
  .btn-warn { background: #f3f4f6; color: #374151; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: transform .15s; }
  .btn-warn:active { transform: scale(.97); }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row .btn-primary, .btn-row .btn-danger, .btn-row .btn-warn { flex: 1; }

  .config-group { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .config-group-title { font-size: 12.5px; font-weight: 800; color: var(--wa-deep); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 12px; }
  .config-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
  .config-row:last-child { border-bottom: none; }
  .config-row .cr-info { flex: 1; min-width: 0; }
  .config-row .cr-label { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .config-row .cr-cle { font-size: 10.5px; color: var(--muted); font-family: monospace; }
  .config-row input { width: 100px; padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 14px; font-weight: 700; text-align: right; font-family: inherit; outline: none; background: #f7faf8; }
  .config-row input:focus { border-color: var(--wa-green); background: #fff; }

  .search-input { padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-family: inherit; font-size: 13px; max-width: 180px; outline: none; }
  .search-input:focus { border-color: var(--wa-green); }

  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -ms-overflow-style: none; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #fff; border: 1.5px solid var(--border); color: var(--muted); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .filter-chip.active { background: linear-gradient(135deg, var(--wa-dark), var(--wa-green)); color: #fff; border-color: transparent; }

  .candidature-reponses {
    background: #f7faf8; border-radius: 10px; padding: 10px 12px; margin-top: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .candidature-reponses .rep-row {
    display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px;
  }
  .candidature-reponses .rep-row .k { color: var(--muted); font-weight: 600; }
  .candidature-reponses .rep-row .v { color: var(--text); font-weight: 700; text-align: right; word-break: break-word; max-width: 60%; }

  .sk-item { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .sk-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin-bottom: 8px; }
  .sk-line.w1 { width: 40%; height: 16px; }
  .sk-line.w2 { width: 70%; }

  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--wa-deep); color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: all .3s; z-index: 1000; display: flex; align-items: center; gap: 8px; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast svg { stroke: var(--wa-green); flex-shrink: 0; }
  .toast.error { background: #b91c1c; }
  .toast.error svg { stroke: #fff; }
</style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="loader-logo">Affinity<span> Admin</span></div>
    <div class="spinner"></div>
  </div>

  <header class="header">
    <div class="header-logo-wrap">
      <img src="https://i.ibb.co/996nZCn7/file-000000000e4481f49ce58934aa6b6a51.png" alt="">
      <div class="logo">
        Affinity <span class="badge-admin">Admin</span>
      </div>
    </div>
    <button class="btn-exit" onclick="go('dashboard')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="stats">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      Stats
    </button>
    <button class="tab" data-tab="candidatures">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
      </svg>
      Partenaires
      <span class="tab-badge" id="candBadge"></span>
    </button>
    <button class="tab" data-tab="types">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 7h-9M14 17H5"/>
        <circle cx="17" cy="17" r="3"/>
        <circle cx="7" cy="7" r="3"/>
      </svg>
      Types
    </button>
    <button class="tab" data-tab="recharges">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Recharges
      <span class="tab-badge" id="rechargesBadge"></span>
    </button>
    <button class="tab" data-tab="retraits">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/>
      </svg>
      Retraits
      <span class="tab-badge" id="retraitsBadge"></span>
    </button>
    <button class="tab" data-tab="users">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
      Users
    </button>
    <button class="tab" data-tab="plans">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      </svg>
      Plans
    </button>
    <button class="tab" data-tab="plantations">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 20h10M10 20c5.5-2.5.8-6.4 3-10"/>
      </svg>
      Plantations
    </button>
    <button class="tab" data-tab="actualites">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Z"/>
      </svg>
      Actus
    </button>
    <button class="tab" data-tab="loteries">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
      </svg>
      Loterie
    </button>
    <button class="tab" data-tab="pays">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
      </svg>
      Pays
    </button>
    <button class="tab" data-tab="bonus">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
      </svg>
      Bonus
    </button>
    <button class="tab" data-tab="top">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
      Top
    </button>
  </nav>

  <main class="content">

    <!-- STATS -->
    <div class="panel active" id="panel-stats">
      <div class="stats-grid" id="statsGrid">
        <div class="sk-item"><div class="sk-line w1"></div><div class="sk-line w2"></div></div>
        <div class="sk-item"><div class="sk-line w1"></div><div class="sk-line w2"></div></div>
      </div>
    </div>

    <!-- CANDIDATURES PARTENAIRES -->
    <div class="panel" id="panel-candidatures">
      <div class="admin-toolbar">
        <h2>Candidatures partenaires</h2>
        <span class="badge orange" id="candPendingBadge">— en attente</span>
      </div>
      <div class="filter-row" id="candFilters">
        <button class="filter-chip active" data-filter="all">Toutes</button>
        <button class="filter-chip" data-filter="nouveau">Nouvelles</button>
        <button class="filter-chip" data-filter="approuve">Approuvées</button>
