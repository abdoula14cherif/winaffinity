<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Network — Roue de la fortune</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --wa-green: #25D366; --wa-dark: #128C7E; --wa-deep: #075E54;
    --alibaba: #FF6A00; --gold: #FFB800;
    --bg: #f7f9f8; --text: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
  }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; overflow-x: hidden; }

  .loader { position: fixed; inset: 0; z-index: 9999; background: var(--wa-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .6s ease, visibility .6s ease; }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader-logo { font-size: 24px; font-weight: 700; color: #fff; }
  .loader-logo span { color: var(--wa-green); }
  .spinner { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--wa-green); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,184,0,.5); } 50% { box-shadow: 0 0 0 15px rgba(255,184,0,0); } }
  @keyframes shine { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
  .anim { opacity: 0; animation: fadeInUp .5s ease forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .2s; }

  .header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--wa-deep); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .burger { cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.12); }
  .burger svg { stroke: #fff; }
  .logo { font-weight: 700; font-size: 18px; }
  .logo span { color: var(--wa-green); }

  .menu { position: fixed; top: 0; left: 0; height: 100%; width: 280px; background: #fff; z-index: 200; transform: translateX(-100%); transition: transform .35s cubic-bezier(.4,0,.2,1); box-shadow: 4px 0 20px rgba(0,0,0,.2); padding-top: 18px; display: flex; flex-direction: column; overflow-y: auto; }
  .menu.open { transform: translateX(0); }
  .menu-header { padding: 8px 20px 18px; border-bottom: 1px solid #eee; margin-bottom: 10px; font-weight: 700; color: var(--wa-deep); font-size: 17px; display: flex; align-items: center; gap: 10px; }
  .menu-header svg { stroke: var(--wa-green); }
  .menu-item { display: flex; align-items: center; gap: 14px; padding: 15px 22px; cursor: pointer; font-size: 15px; color: #333; }
  .menu-item svg { stroke: var(--wa-dark); flex-shrink: 0; }
  .menu-item.active { background: #e7f9ee; color: var(--wa-deep); font-weight: 700; }
  .menu-footer { margin-top: auto; padding: 16px 20px 22px; border-top: 1px solid #eee; }
  .btn-logout { width: 100%; padding: 14px; background: #fee2e2; color: #b91c1c; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-logout svg { stroke: #b91c1c; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .content { padding: 0 0 20px; }

  .hero { background: linear-gradient(135deg, #B45309, var(--gold)); color: #fff; padding: 26px 20px 30px; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.15); top: -100px; right: -70px; }
  .hero-content { position: relative; z-index: 2; }
  .hero-icon { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; font-size: 28px; }
  .hero h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .hero p { font-size: 13.5px; opacity: .95; line-height: 1.5; }

  /* WHEEL */
  .wheel-section { padding: 20px; text-align: center; }
  .wheel-wrap { position: relative; width: 280px; height: 280px; margin: 0 auto 24px; }
  .wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 26px solid #DC2626; z-index: 10; filter: drop-shadow(0 4px 8px rgba(220,38,38,.5)); }
  .wheel-pointer::after { content: ''; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; border-radius: 50%; background: #DC2626; box-shadow: 0 0 0 4px rgba(255,255,255,.9); }
  .wheel-container { position: relative; width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 40px rgba(0,0,0,.25), inset 0 0 0 8px #fff, inset 0 0 0 14px var(--gold); transition: transform 4s cubic-bezier(.17,.67,.16,1); }
  .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #FFD966); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1a1a1a; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.3), inset 0 -3px 8px rgba(0,0,0,.1); border: 3px solid #fff; z-index: 5; line-height: 1.1; text-align: center; }

  .secteur { position: absolute; top: 50%; left: 50%; transform-origin: 0 0; font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none; }

  .btn-spin { width: 240px; height: 56px; margin: 0 auto; display: block; background: linear-gradient(135deg, #FF8A3D, var(--alibaba)); color: #fff; border: none; border-radius: 30px; font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit; box-shadow: 0 8px 24px rgba(255,106,0,.4); display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s; position: relative; overflow: hidden; animation: glow 2s ease-in-out infinite; }
  .btn-spin:active { transform: scale(.96); }
  .btn-spin:disabled { background: #d1d5db; box-shadow: none; cursor: not-allowed; animation: none; }
  .btn-spin svg { stroke: #fff; }

  .spin-info { margin-top: 14px; font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.5; }

  .section-title { padding: 0 20px; font-size: 15px; font-weight: 700; color: var(--wa-deep); margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-title svg { stroke: var(--wa-green); }

  .gain-item { margin: 0 20px 8px; background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); display: flex; align-items: center; gap: 12px; animation: fadeInUp .4s ease forwards; opacity: 0; }
  .gain-item .gi-icon { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--gold), #FFD966); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .gain-item .gi-body { flex: 1; min-width: 0; }
  .gain-item .gi-title { font-size: 13.5px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
  .gain-item .gi-sub { font-size: 11px; color: var(--muted); }
  .gain-item .gi-gain { font-size: 15px; font-weight: 800; color: var(--wa-dark); flex-shrink: 0; }

  .empty { margin: 0 20px; text-align: center; padding: 30px 20px; color: var(--muted); font-size: 13px; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .empty svg { stroke: #d1d5db; margin-bottom: 10px; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #e5e7eb; box-shadow: 0 -2px 12px rgba(0,0,0,.06); z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 9px 0 10px; cursor: pointer; color: #9ca3af; font-size: 11px; gap: 4px; text-decoration: none; font-weight: 500; }
  .nav-item svg { stroke: #9ca3af; }
  .nav-item.active { color: var(--wa-dark); font-weight: 700; }
  .nav-item.active svg { stroke: var(--wa-green); }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(20px); background: var(--wa-deep); color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: all .3s; z-index: 1000; display: flex; align-items: center; gap: 8px; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast svg { stroke: var(--wa-green); flex-shrink: 0; }
  .toast.win { background: linear-gradient(135deg, var(--gold), #FFD966); color: #1a1a1a; font-weight: 800; font-size: 16px; padding: 16px 28px; }
  .toast.win svg { stroke: #1a1a1a; }
  .toast.error { background: #b91c1c; }
  .toast.error svg { stroke: #fff; }

  /* Modal gain */
  .win-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .3s; backdrop-filter: blur(4px); }
  .win-modal.open { opacity: 1; pointer-events: auto; }
  .win-card { background: #fff; border-radius: 24px; padding: 30px 24px; text-align: center; max-width: 340px; width: 100%; transform: scale(.8); transition: transform .4s cubic-bezier(.4,0,.2,1); position: relative; overflow: hidden; }
  .win-modal.open .win-card { transform: scale(1); }
  .win-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,184,0,.3), transparent 40%); animation: pulse 2s ease-in-out infinite; pointer-events: none; }
  .win-emoji { font-size: 64px; margin-bottom: 12px; position: relative; z-index: 2; animation: pulse 1s ease-in-out infinite; }
  .win-title { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 6px; position: relative; z-index: 2; }
  .win-amount { font-size: 44px; font-weight: 800; background: linear-gradient(135deg, var(--gold), var(--alibaba)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; position: relative; z-index: 2; }
  .win-btn { background: linear-gradient(135deg, var(--wa-dark), var(--wa-green)); color: #fff; border: none; border-radius: 14px; padding: 14px 28px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; box-shadow: 0 6px 20px rgba(18,140,126,.4); position: relative; z-index: 2; width: 100%; }
  .win-btn:active { transform: scale(.97); }

  @keyframes confetti {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
  }
  .confetti { position: absolute; width: 10px; height: 10px; top: 0; pointer-events: none; animation: confetti 3s linear infinite; }
</style>

<script>
  const SUPABASE_URL = 'https://ydwjvvlcnqsftciedpqm.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd2p2dmxjbnFzZnRjaWVkcHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDQyNDAsImV4cCI6MjEwNTY4MDI0MH0.4uQwBGedMBjUZErd8lUM5YfA26gw96RvHdo_J-3PZCY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  let CURRENT_USER = null;
  let SECTEURS = [];
  let isSpinning = false;

  (async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.replace('inscription.html'); return; }
    CURRENT_USER = session.user;

    await loadConfig();
    await drawWheel();
    await checkCanSpin();
    await loadGains();

    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 400);
  })();

  // ================= CONFIG =================
  async function loadConfig() {
    const { data } = await sb.from('roue_config')
      .select('*').eq('actif', true).order('ordre');
    SECTEURS = data || [];
  }

  // ================= DESSIN ROUE =================
  async function drawWheel() {
    const wheel = document.getElementById('wheel');
    // Retirer les anciens secteurs
    wheel.querySelectorAll('.secteur').forEach(el => el.remove());

    const total = SECTEURS.length;
    if (total === 0) return;

    const angleStep = 360 / total;

    SECTEURS.forEach((s, i) => {
      // Texte avec rotation
      const angle = i * angleStep + angleStep / 2;
      const el = document.createElement('div');
      el.className = 'secteur';
      el.textContent = s.montant + 'F';
      el.style.transform = `rotate(${angle - 90}deg) translate(90px) rotate(${90 - angle}deg)`;
      wheel.appendChild(el);
    });

    // Dessiner le fond avec conic-gradient
    const stops = [];
    SECTEURS.forEach((s, i) => {
      const start = i * angleStep;
      const end = (i + 1) * angleStep;
      stops.push(`${s.couleur} ${start}deg ${end}deg`);
    });
    wheel.style.background = `conic-gradient(${stops.join(',')})`;
  }

  // ================= PEUT TOURNER ? =================
  async function checkCanSpin() {
    const { data, error } = await sb.rpc('peut_tourner_roue');
    const btn = document.getElementById('btnSpin');
    const btnText = document.getElementById('btnSpinText');
    const info = document.getElementById('spinInfo');

    if (error || !data) {
      btn.disabled = true;
      btnText.textContent = 'Erreur';
      info.textContent = 'Impossible de vérifier ton tour';
      return;
    }

    if (!data.peut) {
      btn.disabled = true;
      btnText.textContent = 'Reviens demain';
      info.innerHTML = `🚫 <b>${data.raison || 'Déjà utilisé'}</b><br>Reviens demain pour un nouveau tour gratuit !`;
    } else {
      btn.disabled = false;
      btnText.textContent = 'Tourner gratuitement';
      info.innerHTML = `🎁 Tu as <b>${data.tours_restants} tour gratuit</b> disponible aujourd'hui`;
    }
  }

  // ================= SPIN =================
  async function spin() {
    if (isSpinning) return;
    isSpinning = true;

    const btn = document.getElementById('btnSpin');
    const btnText = document.getElementById('btnSpinText');
    const wheel = document.getElementById('wheel');

    btn.disabled = true;
    btnText.textContent = 'En cours...';

    // Appel RPC
    const { data, error } = await sb.rpc('tourner_roue');

    if (error) {
      isSpinning = false;
      btn.disabled = false;
      btnText.textContent = 'Tourner gratuitement';
      showToast(error.message || 'Erreur', true);
      return;
    }

    // Calculer l'angle pour tomber sur le secteur gagnant
    const total = SECTEURS.length;
    const angleStep = 360 / total;
    const indexGagnant = SECTEURS.findIndex(s => s.secteur === data.secteur);
    const angleCible = 360 - (indexGagnant * angleStep) - angleStep / 2;

    // Plusieurs tours pour l'effet
    const tours = 5;
    const angleFinal = angleCible + (360 * tours) + (Math.random() * (angleStep - 8)) - (angleStep / 2 - 4);

    wheel.style.transition = 'transform 4s cubic-bezier(.17,.67,.16,1)';
    wheel.style.transform = `rotate(${angleFinal}deg)`;

    // Attendre la fin de l'animation
    setTimeout(async () => {
      isSpinning = false;
      // Afficher le modal de gain
      showWinModal(data.montant);
      // Reset transform sans animation
      setTimeout(() => {
        wheel.style.transition = 'none';
        wheel.style.transform = `rotate(${angleFinal % 360}deg)`;
      }, 300);

      // Recharger
      await checkCanSpin();
      await loadGains();
    }, 4100);
  }

  // ================= WIN MODAL =================
  function showWinModal(montant) {
    document.getElementById('winAmount').textContent = '+' + formatF(montant);
    document.getElementById('winEmoji').textContent = montant >= 1000 ? '💎' : montant >= 500 ? '🎉' : '🎊';
    document.getElementById('winModal').classList.add('open');

    // Confettis
    const modal = document.getElementById('winModal');
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = ['#FFB800', '#FF6A00', '#25D366', '#128C7E', '#DC2626'][Math.floor(Math.random() * 5)];
      c.style.animationDelay = Math.random() * 1 + 's';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      modal.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  function closeWin() {
    document.getElementById('winModal').classList.remove('open');
  }

  // ================= HISTORIQUE GAINS =================
  async function loadGains() {
    const list = document.getElementById('gainsList');
    const { data, error } = await sb.from('roue_tirages')
      .select('*').eq('user_id', CURRENT_USER.id)
      .order('created_at', { ascending: false }).limit(20);

    if (error || !data || data.length === 0) {
      list.innerHTML = `<div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
        </svg>
        <div>Aucun gain pour le moment</div>
        <div style="font-size:12px;margin-top:6px;opacity:.7">Tourne la roue pour commencer !</div>
      </div>`;
      return;
    }

    list.innerHTML = data.map((t, i) => {
      const emoji = t.montant >= 1000 ? '💎' : t.montant >= 500 ? '🎉' : '🎊';
      return `
        <div class="gain-item" style="animation-delay:${i * .04}s">
          <div class="gi-icon">${emoji}</div>
          <div class="gi-body">
            <div class="gi-title">Roue de la fortune</div>
            <div class="gi-sub">${timeAgo(t.created_at)}</div>
          </div>
          <div class="gi-gain">+${formatF(t.montant)}</div>
        </div>
      `;
    }).join('');
  }

  // ================= UTILITAIRES =================
  function formatF(n) {
    return Math.round(Number(n || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F';
  }
  function timeAgo(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return 'À l\'instant';
    if (diff < 3600) return `Il y a ${Math.floor(diff/60)} min`;
    if (diff < 86400) return `Il y a ${Math.floor(diff/3600)} h`;
    if (diff < 604800) return `Il y a ${Math.floor(diff/86400)} j`;
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
  }
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
  function toggleMenu() {
    document.getElementById('menu').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
  }
  function go(page) { window.location.href = page; }
  async function logout() {
    if (!confirm('Veux-tu vraiment te déconnecter ?')) return;
    await sb.auth.signOut();
    window.location.replace('inscription.html');
  }
</script>
